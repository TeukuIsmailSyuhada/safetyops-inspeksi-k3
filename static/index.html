<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SafetyOps Inspect</title><style>
:root{--b:#f8fafc;--s:#fff;--line:#e2e8f0;--ink:#0f172a;--muted:#64748b;--blue:#2563eb;--green:#15803d;--amber:#b45309;--red:#b91c1c}*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;background:var(--b);color:var(--ink)}button,input,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;padding-left:230px}.side{position:fixed;inset:0 auto 0 0;width:230px;background:#fff;border-right:1px solid var(--line);padding:22px 14px}.brand{display:flex;gap:10px;align-items:center;font-weight:700;font-size:17px}.logo{background:var(--blue);color:#fff;border-radius:8px;padding:9px}.nav button{display:block;width:100%;border:0;background:transparent;padding:11px;text-align:left;border-radius:7px;color:#334155}.nav button:hover,.nav button.on{background:#eff6ff;color:#1d4ed8}.nav{margin-top:28px}.main{max-width:1180px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:14px;align-items:end;margin-bottom:22px}h1{margin:0;font-size:26px}h2{margin:0;font-size:18px}p{color:var(--muted);margin:7px 0}.btn{border:1px solid var(--blue);background:var(--blue);color:#fff;border-radius:7px;padding:10px 13px;font-weight:600}.btn.out{background:#fff;color:#334155;border-color:#cbd5e1}.grid{display:grid;gap:14px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{background:#fff;border:1px solid var(--line);border-radius:8px}.card .hd{padding:16px;border-bottom:1px solid var(--line)}.card .body{padding:16px}.stat{padding:16px}.num{font-size:27px;font-weight:700;margin-top:10px}.row{display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:13px 16px}.row:last-child{border:0}.grow{flex:1}.code{font-weight:700}.small{font-size:12px;color:var(--muted)}.badge{border-radius:99px;padding:5px 8px;font-size:12px;font-weight:700;border:1px solid}.Aman{color:var(--green);background:#ecfdf5;border-color:#bbf7d0}.Perlu{color:var(--amber);background:#fffbeb;border-color:#fde68a}.Kritis{color:var(--red);background:#fef2f2;border-color:#fecaca}.detail{display:grid;grid-template-columns:1fr 290px;gap:16px}.info{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;border-top:1px solid var(--line);margin-top:18px;padding-top:16px}.qr{width:165px;height:165px;margin:auto;background:repeating-linear-gradient(90deg,#111 0 7px,#fff 7px 12px),repeating-linear-gradient(#111 0 7px,#fff 7px 12px);background-blend-mode:multiply}.step{height:5px;background:#e2e8f0;margin-top:14px}.step span{display:block;background:var(--blue);height:100%}.photo{border:1px dashed #94a3b8;border-radius:8px;min-height:220px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:#f8fafc}.photo img{width:100%;max-height:260px;object-fit:cover;border-radius:8px}.question{padding:15px 0;border-bottom:1px solid var(--line)}.options button{margin:9px 7px 0 0;border:1px solid #cbd5e1;background:#fff;border-radius:7px;padding:9px}.options button.sel{border-color:var(--blue);background:#eff6ff;color:#1d4ed8}.warn{background:#fffbeb;border:1px solid #fde68a;padding:14px;border-radius:8px;margin-top:15px}textarea{width:100%;min-height:74px;padding:9px;border:1px solid #cbd5e1;border-radius:7px;margin-top:8px}.actions{display:flex;justify-content:space-between;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}.hide{display:none}.back{border:0;background:transparent;color:#475569;padding:0 0 14px}.bar{height:8px;background:#e2e8f0;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%}@media(max-width:700px){.app{padding-left:0}.side{display:none}.main{padding:18px}.g3,.g2,.detail{grid-template-columns:1fr}.info{grid-template-columns:1fr}.top{align-items:start;flex-direction:column}.mobile{display:flex!important;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);justify-content:space-around;padding:8px;z-index:2}.mobile button{border:0;background:#fff;color:#475569;font-size:12px}.main{padding-bottom:76px}}.mobile{display:none}
</style></head><body><div class="app"><aside class="side"><div class="brand"><span class="logo">✓</span>SafetyOps Inspect</div><p class="small">Sistem Inspeksi Alat K3</p><nav class="nav"><button onclick="go('dashboard')">Dashboard</button><button onclick="go('tools')">Daftar Alat</button><button onclick="go('history')">Riwayat</button><button onclick="go('recap')">Rekap</button></nav></aside><main class="main" id="app"></main><nav class="mobile"><button onclick="go('dashboard')">Beranda</button><button onclick="go('tools')">Alat</button><button onclick="go('history')">Riwayat</button><button onclick="go('recap')">Rekap</button></nav></div><script>
const tools=[['apar-rkt-01','APAR-RKT-01','APAR Dry Chemical 3 kg','Area Produksi A','Dekat Panel A-03','Aman'],['apar-gdg-01','APAR-GDG-01','APAR CO₂ 5 kg','Gudang Bahan Baku','Pintu Timur','Perlu Tindakan'],['apar-rkt-02','APAR-RKT-02','APAR Foam 6 L','Area Produksi B','Dekat Mesin Press','Aman'],['hyd-gdg-01','HYD-GDG-01','Hydrant Box','Gudang Bahan Baku','Koridor Utara','Kritis'],['p3k-ktr-01','P3K-KTR-01','Kotak P3K','Kantor Operasional','Lobi Lantai 1','Aman'],['eye-lab-01','EYE-LAB-01','Eyewash Station','Laboratorium','Pintu Masuk Lab','Perlu Tindakan']];let view='dashboard',selected=tools[0],step=1,photo='',answers={},note='';let history=JSON.parse(localStorage.getItem('so-history')||'[]');const q=[['cylinder','Kondisi tabung',['Baik','Perlu Perhatian','Tidak Baik']],['seal','Segel dan pin pengaman',['Terpasang','Tidak Terpasang']],['pressure','Indikator tekanan',['Normal','Tidak Normal']],['hose','Kondisi selang dan nozzle',['Baik','Perlu Perhatian','Tidak Baik']],['placement','Alat mudah dijangkau',['Ya','Tidak']]];const tag=s=>`<span class="badge ${s==='Aman'?'Aman':s==='Kritis'?'Kritis':'Perlu'}">${s}</span>`;const head=(t,d,b='')=>`<div class="top"><div><h1>${t}</h1><p>${d}</p></div>${b}</div>`;function status(){let v=Object.values(answers);if(v.some(x=>['Tidak Baik','Tidak Normal','Tidak'].includes(x)))return'Kritis';if(v.some(x=>['Perlu Perhatian','Tidak Terpasang'].includes(x)))return'Perlu Tindakan';return'Aman'}function go(x){view=x;render()}function detail(i){selected=tools.find(x=>x[0]===i);view='detail';render()}function inspect(){step=1;photo='';answers={};note='';view='inspect';render()}function render(){let a=document.querySelector('#app');if(view==='dashboard'){let bad=tools.filter(x=>x[5]!=='Aman');a.innerHTML=head('Dashboard','Ringkasan kondisi inspeksi alat K3 hari ini','<button class="btn" onclick="inspect()">Scan QR & Mulai Inspeksi</button>')+`<div class="grid g3">${[['Total alat',tools.length],['Perlu inspeksi',bad.length],['Temuan aktif',bad.length]].map(x=>`<div class="card stat"><span class="small">${x[0]}</span><div class="num">${x[1]}</div><p class="small">Data demo</p></div>`).join('')}</div><div class="grid g2" style="margin-top:16px"><div class="card"><div class="hd"><h2>Temuan prioritas</h2><p>Alat yang perlu ditindaklanjuti</p></div>${bad.map(x=>`<button class="row" onclick="detail('${x[0]}')"><span>🛡</span><span class="grow"><span class="code">${x[1]}</span><span class="small">${x[4]}</span></span>${tag(x[5])}</button>`).join('')}</div><div class="card"><div class="hd"><h2>Alur inspeksi</h2></div><div class="body"><p><b>1. Identifikasi</b><br>Scan QR atau pilih alat.</p><p><b>2. Dokumentasi</b><br>Ambil foto kondisi aktual.</p><p><b>3. Checklist</b><br>Isi hasil dan simpan inspeksi.</p></div></div></div>`}else if(view==='tools'){a.innerHTML=head('Daftar Alat','Pilih aset K3 untuk melihat detail atau memulai inspeksi','<button class="btn" onclick="inspect()">Scan QR demo</button>')+`<div class="card">${tools.map(x=>`<button class="row" onclick="detail('${x[0]}')"><span>🛡</span><span class="grow"><span class="code">${x[1]}</span><span class="small">${x[2]} · ${x[3]}</span></span>${tag(x[5])}</button>`).join('')}</div>`}else if(view==='detail'){a.innerHTML=`<button class="back" onclick="go('tools')">← Daftar Alat</button><div class="detail"><div class="card"><div class="body"><div style="display:flex;justify-content:space-between;gap:10px"><div><span class="small">${selected[1]}</span><h1 style="margin-top:5px">${selected[2]}</h1><p>📍 ${selected[3]} · ${selected[4]}</p></div>${tag(selected[5])}</div><div class="info"><div><span class="small">Jenis</span><b>APAR</b></div><div><span class="small">Inspeksi terakhir</span><b>19 Sep 2026</b></div><div><span class="small">Status</span><b>${selected[5]}</b></div></div></div></div><div class="card"><div class="body" style="text-align:center"><h2>Identitas QR alat</h2><p class="small">QR mewakili ${selected[1]}</p><div class="qr"></div><p><b>${selected[1]}</b></p><button class="btn out" onclick="window.print()">Cetak label QR</button><button class="btn" style="display:block;width:100%;margin-top:9px" onclick="inspect()">Mulai Inspeksi</button></div></div></div>`}else if(view==='inspect')inspection(a);else if(view==='result'){let s=status(),rec=s==='Kritis'?['Hentikan penggunaan alat sementara.','Hubungi vendor atau teknisi.','Lakukan inspeksi ulang.']:s==='Perlu Tindakan'?['Jadwalkan pemeriksaan komponen.','Pantau sampai inspeksi berikutnya.']:['Alat dapat tetap digunakan.','Lanjutkan inspeksi rutin.'];a.innerHTML=`<div class="card" style="max-width:620px;margin:auto"><div class="body"><span class="logo">✓</span><p>Hasil inspeksi tersimpan</p><h1>${selected[1]}</h1><div class="warn">${tag(s)}<h2 style="margin-top:12px">Rekomendasi</h2>${rec.map((x,i)=>`<p>${i+1}. ${x}</p>`).join('')}</div><div class="actions"><button class="btn out" onclick="go('dashboard')">Dashboard</button><button class="btn" onclick="go('history')">Lihat riwayat</button></div></div></div>`}else if(view==='history'){a.innerHTML=head('Riwayat Inspeksi','Catatan inspeksi yang telah disimpan')+`<div class="card">${history.length?history.map(x=>`<div class="row"><span>📋</span><span class="grow"><span class="code">${x.code}</span><span class="small">${x.date}</span></span>${tag(x.status)}</div>`).join(''):'<p class="body">Belum ada riwayat inspeksi.</p>'}</div>`}else{let n=s=>tools.filter(x=>x[5]===s).length;a.innerHTML=head('Rekap Inspeksi','Ringkasan kondisi alat berdasarkan data demo','<button class="btn out" onclick="window.print()">Cetak rekap</button>')+`<div class="grid g2"><div class="card"><div class="body"><h2>Ringkasan periode</h2><p>Total alat: <b>${tools.length}</b></p><p>Total inspeksi baru: <b>${history.length}</b></p></div></div><div class="card"><div class="body"><h2>Kondisi alat</h2>${['Aman','Perlu Tindakan','Kritis'].map(s=>`<p style="display:flex;justify-content:space-between">${tag(s)} <b>${n(s)} alat</b></p><div class="bar"><i style="width:${n(s)/tools.length*100}%;background:${s==='Aman'?'#15803d':s==='Kritis'?'#b91c1c':'#b45309'}"></i></div>`).join('')}</div></div></div>`}}function inspection(a){let pct=step/3*100;if(step===1)a.innerHTML=`<button class="back" onclick="detail('${selected[0]}')">← Batalkan inspeksi</button><div class="card"><div class="hd"><h2>Dokumentasi · ${selected[1]}</h2><div class="step"><span style="width:${pct}%"></span></div></div><div class="body"><h2>Foto kondisi aktual</h2><p>Foto wajib sebagai dokumentasi setiap inspeksi.</p><label class="photo">${photo?`<img src="${photo}">`:'📷<b style="margin-top:10px">Ambil foto kondisi alat</b><span class="small">Gunakan kamera perangkat.</span>'}<input class="hide" type="file" accept="image/*" capture="environment" onchange="take(event)"></label><div class="actions"><span></span><button class="btn" ${photo?'':'disabled'} onclick="step=2;render()">Lanjut ke checklist →</button></div></div></div>`;else if(step===2)a.innerHTML=`<div class="card"><div class="hd"><h2>Checklist APAR · ${selected[1]}</h2><div class="step"><span style="width:${pct}%"></span></div></div><div class="body">${q.map(x=>`<div class="question"><b>${x[1]}</b><div class="options">${x[2].map(o=>`<button class="${answers[x[0]]===o?'sel':''}" onclick="answers['${x[0]}']='${o}';render()">${o}</button>`).join('')}</div></div>`).join('')}${status()!=='Aman'&&Object.keys(answers).length?`<div class="warn"><b>Catatan temuan wajib</b><textarea oninput="note=this.value" placeholder="Jelaskan kondisi masalah...">${note}</textarea></div>`:''}<div class="actions"><button class="btn out" onclick="step=1;render()">← Sebelumnya</button><button class="btn" ${q.every(x=>answers[x[0]])&&(status()==='Aman'||note.trim())?'':'disabled'} onclick="step=3;render()">Review hasil →</button></div></div></div>`;else{let s=status();a.innerHTML=`<div class="card"><div class="hd"><h2>Review hasil · ${selected[1]}</h2><div class="step"><span style="width:${pct}%"></span></div></div><div class="body"><img class="photo" style="min-height:0;height:180px;object-fit:cover" src="${photo}"><div class="warn">${tag(s)}<p>${s==='Aman'?'Alat dapat tetap digunakan sesuai prosedur.':s==='Kritis'?'Hentikan penggunaan sementara dan hubungi teknisi.':'Jadwalkan pemeriksaan komponen.'}</p></div><div class="actions"><button class="btn out" onclick="step=2;render()">← Sebelumnya</button><button class="btn" onclick="save()">Simpan hasil inspeksi</button></div></div></div>`}}function take(e){let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{photo=r.result;render()};r.readAsDataURL(f)}function save(){let s=status();history.unshift({code:selected[1],status:s,date:new Date().toLocaleString('id-ID')});localStorage.setItem('so-history',JSON.stringify(history));selected[5]=s;view='result';render()}render();
</script><script>
let cameraStream=null,capturedAt='';
function stopCamera(){if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}}
async function openCamera(){try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});const video=document.querySelector('#camera-preview');if(video){video.srcObject=cameraStream;await video.play()}}catch(e){document.querySelector('#camera-message').textContent='Kamera tidak dapat diakses. Izinkan kamera pada browser lalu coba lagi.'}}
function capturePhoto(){const video=document.querySelector('#camera-preview'),canvas=document.createElement('canvas');canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0);photo=canvas.toDataURL('image/jpeg',0.85);capturedAt=new Date().toLocaleString('id-ID');stopCamera();render()}
window.inspect=function(){stopCamera();step=1;photo='';capturedAt='';answers={};note='';view='inspect';render()}
window.inspection=function(a){let pct=step/3*100;if(step===1){a.innerHTML=`<button class="back" onclick="detail('${selected[0]}')">← Batalkan inspeksi</button><div class="card"><div class="hd"><h2>Dokumentasi · ${selected[1]}</h2><div class="step"><span style="width:${pct}%"></span></div></div><div class="body"><h2>Foto kondisi aktual</h2><p>Foto wajib diambil langsung dari kamera. Waktu pengambilan ikut disimpan sebagai metadata.</p>${photo?`<div class="photo"><img src="${photo}"></div><p class="small">Diambil: ${capturedAt}</p><button class="btn out" onclick="photo='';capturedAt='';render()">Foto ulang</button>`:`<div class="photo"><video id="camera-preview" autoplay playsinline style="display:none;width:100%;max-height:300px;object-fit:cover;border-radius:8px"></video><span id="camera-message">Aktifkan kamera belakang untuk memotret kondisi alat.</span><button class="btn" style="margin-top:14px" onclick="document.querySelector('#camera-preview').style.display='block';openCamera()">Aktifkan Kamera</button><button class="btn out" style="margin-top:8px" onclick="capturePhoto()">Ambil Foto</button></div>`}<div class="actions"><span></span><button class="btn" ${photo?'':'disabled'} onclick="step=2;render()">Lanjut ke checklist →</button></div></div></div>`;return}return window._oldInspection(a)}
window._oldInspection=inspection;inspection=window.inspection;
const oldSave=save;save=function(){stopCamera();let s=status();history.unshift({code:selected[1],status:s,date:new Date().toLocaleString('id-ID'),capturedAt});localStorage.setItem('so-history',JSON.stringify(history));selected[5]=s;view='result';render()}
</script></body></html>
