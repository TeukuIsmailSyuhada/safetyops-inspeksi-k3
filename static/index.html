function filter(){let root=document.querySelector('#rows');if(!root)return;let q=(document.querySelector('#q').value||'').toLowerCase(),type=document.querySelector('#fType').value,loc=document.querySelector('#fLoc').value,c=document.querySelector('#fCond').value,s=document.querySelector('#fState').value;let arr=assets.filter(x=>`${x[I.code]} ${x[I.name]} ${x[I.location]}`.toLowerCase().includes(q)&&(!type||x[I.type]===type)&&(!loc||x[I.location]===loc)&&(!c||x[I.condition]===c)&&(!s||x[I.inspection]===s));root.innerHTML=arr.length?arr.map(x=>row(x,`<span class="sub">${x[I.name]} Â· ${x[I.type]} Â· ${x[I.location]}<br>Terakhir ${x[I.last]} Â· Berikutnya ${x[I.next]}</span>`,`${cond(x[I.condition])} ${state(x[I.inspection])}`)).join(''):`<div class="empty"><strong>Tidak ada alat yang sesuai</strong>Ubah kata kunci atau filter pencarian.</div>`}
function detail(a){a.innerHTML=`<button class="back" onclick="go('assets')">â† Kembali ke daftar alat</button><div class="detail"><div class="panel"><div class="body"><div class="dhead"><div><span class="sub">${chosen[I.code]}</span><h1>${chosen[I.name]}</h1><span class="sub">${chosen[I.type]} Â· ${chosen[I.location]} Â· ${chosen[I.point]}</span></div>${cond(chosen[I.condition])}</div><div class="facts"><div class="fact"><label>Status inspeksi</label>${state(chosen[I.inspection])}</div><div class="fact"><label>Inspeksi terakhir</label><strong>${chosen[I.last]}</strong><span class="sub">${chosen[I.inspector]}</span></div><div class="fact"><label>Inspeksi berikutnya</label><strong>${chosen[I.next]}</strong></div></div><div class="navtitle" style="color:#6e819c;margin:20px 0 7px">TEMUAN & TINDAK LANJUT</div><div class="panel"><div class="body"><b>${chosen[I.finding]}</b><span class="sub">Status tindak lanjut: <b>${chosen[I.follow]}</b></span><p class="sub">${chosen[I.follow]==='Terbuka'?'Verifikasi perbaikan sebelum alat digunakan kembali.':'Tidak ada tindakan terbuka pada aset ini.'}</p></div></div><div class="navtitle" style="color:#6e819c;margin:20px 0 7px">RIWAYAT TERBARU</div><span class="sub">${history.filter(x=>x.assetId===chosen[I.id]).length?history.filter(x=>x.assetId===chosen[I.id]).slice(0,2).map(x=>`${x.date} Â· ${x.condition}`).join('<br>'):'Belum ada inspeksi baru tersimpan untuk aset ini.'}</span></div></div><aside class="panel"><div class="body" style="text-align:center"><h2 style="margin:0">Identitas QR alat</h2><p class="sub">QR mewakili ${chosen[I.code]}</p><div class="qr"></div><b>${chosen[I.code]}</b><button class="btn" style="display:block;width:100%;margin-top:16px" onclick="useAsset()">Mulai Inspeksi</button><button class="btn outline" style="display:block;width:100%;margin-top:8px" onclick="window.print()">Cetak label</button></div></aside></div>`}function useAsset(){photo='';captured='';answers={};notes={};view='photo';draw()}
function scan(a){a.innerHTML=`<button class="back" onclick="go('dashboard')">â† Batalkan inspeksi</button><div class="panel" style="max-width:680px;margin:auto"><div class="hd"><h2>Scan QR alat</h2><p>Langkah 1 dari 4 Â· Arahkan kamera ke label QR aset.</p><div class="progress"><i style="width:25%"></i></div></div><div class="body"><div class="camera" id="scanbox"><div class="cammsg" id="scanmsg"><b>Siap memindai QR</b><br><span class="sub">Izinkan kamera untuk memindai label aset.</span></div></div><div class="hint"><b>Mode demo:</b> bila QR fisik belum tersedia, gunakan simulasi agar alur dapat diuji.</div><div class="actions"><button class="btn outline" onclick="openScan()">Aktifkan kamera</button><button class="btn" onclick="found()">Simulasikan QR terdeteksi</button></div><div id="found"></div></div></div>`}async function openScan(){let box=document.querySelector('#scanbox'),msg=document.querySelector('#scanmsg');try{msg.textContent='Menyalakan kameraâ€¦';scanstream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});box.innerHTML='<video id="scanvid" autoplay playsinline></video><div class="frame"></div>';let v=document.querySelector('#scanvid');v.srcObject=scanstream;await v.play()}catch{msg.innerHTML='<b>Kamera tidak tersedia</b><br><span class="sub">Izinkan kamera pada browser atau gunakan mode demo QR.</span>'}}function found(){stop();document.querySelector('#found').innerHTML=`<div class="notice" style="margin-top:16px"><b>QR terdeteksi</b><span>${chosen[I.code]} Â· ${chosen[I.name]} Â· ${chosen[I.location]}</span></div><button class="btn" style="width:100%" onclick="useAsset()">Konfirmasi & Mulai Inspeksi</button>`}
function camera(a){a.innerHTML=`<button class="back" onclick="go('scan')">â† Kembali ke scan QR</button><div class="panel" style="max-width:680px;margin:auto"><div class="hd"><h2>Dokumentasi kondisi</h2><p>Aset ${chosen[I.code]} Â· Langkah 2 dari 4</p><div class="progress"><i style="width:50%"></i></div></div><div class="body"><h2 style="font-size:17px;margin:0">Ambil foto aktual alat</h2><p class="sub">Pastikan label aset dan kondisi alat terlihat jelas. Foto hanya diambil dari kamera perangkat.</p>${photo?`<img class="preview" src="${photo}" alt="Foto kondisi ${chosen[I.code]}"><div class="meta">Diambil ${captured}</div><div class="actions"><button class="btn outline" onclick="redoPhoto()">Ambil ulang</button><button class="btn" onclick="go('check')">Gunakan foto</button></div>`:`<div class="camera" style="margin-top:14px" id="photobox"><div class="cammsg" id="photomsg"><b>Kamera belum aktif</b><br><span class="sub">Aktifkan kamera belakang untuk mendokumentasikan kondisi alat.</span></div></div><div class="actions"><button class="btn outline" onclick="openPhoto()">Aktifkan kamera</button><button class="btn" onclick="take()">Ambil foto</button></div>`}</div></div>`}async function openPhoto(){let box=document.querySelector('#photobox'),msg=document.querySelector('#photomsg');try{msg.textContent='Menyalakan kameraâ€¦';stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});box.innerHTML='<video id="photovid" autoplay playsinline></video>';let v=document.querySelector('#photovid');v.srcObject=stream;await v.play()}catch{msg.innerHTML='<b>Kamera tidak dapat diakses</b><br><span class="sub">Izinkan kamera pada browser lalu coba lagi.</span>'}}function take(){let v=document.querySelector('#photovid'),msg=document.querySelector('#photomsg');if(!v||v.readyState<2){if(msg)msg.textContent='Aktifkan kamera dan tunggu preview tampil sebelum mengambil foto.';return}let c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);photo=c.toDataURL('image/jpeg',.85);captured=new Date().toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'});stop();draw()}function redoPhoto(){photo='';captured='';draw()}
function checklist(a){let done=filled(),total=items().length,condition=done?rule():'';a.innerHTML=`<button class="back" onclick="go('photo')">â† Kembali ke foto</button><div class="panel" style="max-width:820px;margin:auto"><div class="hd"><div class="dhead"><div><h2>Checklist kondisi APAR</h2><p>Aset ${chosen[I.code]} Â· Langkah 3 dari 4 Â· ${done}/${total} pemeriksaan selesai</p></div>${condition?cond(condition):'<span class="sub">Belum dinilai</span>'}</div><div class="progress"><i style="width:75%"></i></div></div><div class="body"><div class="hint"><b>Isi sesuai kondisi aktual.</b> Status akhir dihitung dari checklist, bukan dari foto.</div>${checks.map(section=>`<section class="section"><h3>${section[0]}</h3><p>Lengkapi setiap pemeriksaan pada bagian ini.</p>${section[1].map(question).join('')}</section>`).join('')}<div class="sticky"><button class="btn outline" onclick="go('photo')">â† Sebelumnya</button><button class="btn" ${done===total&&noteOK()?'':'disabled'} onclick="go('review')">Review hasil â†’</button></div></div></div>`}function question(x){let value=answers[x[0]],bad=flagged(value),n=items().findIndex(y=>y[0]===x[0])+1;return `<div class="question ${bad?'flag':''}"><div class="qtop"><span class="qnum">${n}</span><div class="grow"><b>${x[1]}</b><p>${x[2]}</p></div></div><div class="answers">${x[3].map(o=>`<button class="answer ${value===o?'sel':''}" onclick="answer('${x[0]}','${o}')">${o}</button>`).join('')}</div>${bad?`<textarea aria-label="Catatan temuan ${x[1]}" oninput="note('${x[0]}',this.value)" placeholder="Catatan temuan wajibâ€¦">${esc(notes[x[0]]||'')}</textarea>`:''}</div>`}function answer(k,v){answers[k]=v;if(!flagged(v))delete notes[k];draw()}function note(k,v){notes[k]=v}
function review(a){let condition=rule(),flags=items().filter(x=>flagged(answers[x[0]]));a.innerHTML=`<button class="back" onclick="go('check')">â† Ubah checklist</button><div class="panel" style="max-width:950px;margin:auto"><div class="hd"><div class="dhead"><div><h2>Review inspeksi</h2><p>Aset ${chosen[I.code]} Â· Langkah 4 dari 4</p></div>${cond(condition)}</div><div class="progress"><i style="width:100%"></i></div></div><div class="body"><div class="review"><div><h3 style="margin-top:0">Dokumentasi</h3><img class="preview" src="${photo}" alt="Dokumentasi ${chosen[I.code]}"><div class="meta">Diambil ${captured}</div></div><div><h3 style="margin-top:0">Ringkasan jawaban</h3><div class="panel">${items().map(x=>`<div class="row"><span class="ico">${flagged(answers[x[0]])?'!':'âœ“'}</span><span class="grow"><span class="code">${x[1]}</span><span class="sub">${answers[x[0]]}</span></span></div>`).join('')}</div></div></div>${flags.length?`<div class="notice" style="margin-top:16px"><b>${flags.length} temuan perlu perhatian</b><span>${flags.map(x=>`${x[1]}: ${esc(notes[x[0]])}`).join(' Â· ')}</span></div>`:'<div class="notice" style="margin-top:16px"><b>Tidak ada temuan</b><span>Seluruh jawaban memenuhi kondisi aman.</span></div>'}<div class="sticky"><button class="btn outline" onclick="go('check')">â† Ubah checklist</button><button class="btn" onclick="submit()">Submit inspeksi</button></div></div></div>`}function submit(){view='process';draw();setTimeout(()=>{let condition=rule(),flags=items().filter(x=>flagged(answers[x[0]]));record={id:'in-'+Date.now(),assetId:chosen[I.id],code:chosen[I.code],name:chosen[I.name],date:new Date().toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'}),inspector:'Inspector Demo',condition,findings:flags.length,follow:condition==='Baik'?'Tidak ada':'Terbuka',photo,captured,answers:{...answers},notes:{...notes}};history.unshift(record);localStorage.setItem('safetyops-history',JSON.stringify(history));chosen[I.condition]=condition;chosen[I.inspection]='Completed';chosen[I.last]=record.date;chosen[I.inspector]=record.inspector;chosen[I.finding]=flags.length?flags.map(x=>x[1]).join(', '):'Tidak ada';chosen[I.follow]=record.follow;view='result';draw()},650)}function process(a){a.innerHTML='<div class="panel" style="max-width:780px;margin:auto"><div class="loading"><div class="spin"></div><h2>Memproses hasil inspeksi</h2><p class="sub">Memeriksa kelengkapan data dan menerapkan aturan kondisi alat.</p></div></div>'}
function result(a){let c=chosen[I.condition],advice=c==='Baik'?'Alat dapat digunakan sesuai SOP dan jadwal inspeksi rutin.':c==='Perlu Perhatian'?'Pantau kondisi alat dan jadwalkan pemeriksaan sebelum tanggal berikutnya.':c==='Perlu Perbaikan'?'Jadwalkan perbaikan komponen dan lakukan inspeksi ulang setelah perbaikan.':'Hentikan penggunaan alat sementara. Hubungi penanggung jawab K3 atau teknisi.';a.innerHTML=`<div class="panel" style="max-width:780px;margin:auto"><div class="body"><div class="hint"><span class="sub">HASIL INSPEKSI TERSIMPAN</span><h1 style="margin:5px 0">${chosen[I.code]}</h1>${cond(c)}<p class="sub">Kondisi ditentukan dari jawaban checklist yang tersimpan.</p></div><div class="panel" style="margin-top:16px"><div class="body"><span class="navtitle" style="color:#6e819c;margin:0">TINDAK LANJUT</span><h2 style="font-size:16px;margin:7px 0">${c==='Baik'?'Tidak ada tindakan mendesak':'Prioritas tindak lanjut'}</h2><p>${advice}</p><span class="sub">Status: <b>${chosen[I.follow]}</b></span>${c!=='Baik'?'<button class="btn outline" style="margin-top:12px" onclick="closeFollowup()">Tandai tindak lanjut selesai</button>':''}</div></div><div class="sticky"><button class="btn outline" onclick="go('dashboard')">Dashboard</button><button class="btn" onclick="go('history')">Lihat riwayat</button></div></div></div>`}function closeFollowup(){chosen[I.follow]='Selesai';if(record)record.follow='Selesai';localStorage.setItem('safetyops-history',JSON.stringify(history));draw()}
function histories(a){a.innerHTML=head('Riwayat Inspeksi','Catatan inspeksi yang telah disimpan.')+`<div class="panel"><div class="toolbar"><input class="field search" id="hq" oninput="filterHistory()" aria-label="Cari riwayat" placeholder="Cari alat atau inspector"><select class="field" id="hc" onchange="filterHistory()"><option value="">Semua kondisi</option>${['Baik','Perlu Perhatian','Perlu Perbaikan','Tidak Layak Digunakan'].map(x=>`<option>${x}</option>`).join('')}</select><select class="field" id="hf" onchange="filterHistory()"><option value="">Semua tindak lanjut</option><option>Terbuka</option><option>Selesai</option></select></div><div class="histhead"><span>TANGGAL</span><span>ALAT</span><span>INSPEKTOR</span><span>TEMUAN</span><span>STATUS</span></div><div id="hrows"></div></div>`;filterHistory()}function filterHistory(){let root=document.querySelector('#hrows');if(!root)return;let q=(document.querySelector('#hq').value||'').toLowerCase(),c=document.querySelector('#hc').value,f=document.querySelector('#hf').value,arr=history.filter(x=>`${x.code} ${x.name} ${x.inspector}`.toLowerCase().includes(q)&&(!c||x.condition===c)&&(!f||x.follow===f));root.innerHTML=arr.length?arr.map(x=>`<button class="row click histrow" onclick="openRecord('${x.id}')"><span class="hide">${esc(x.date)}</span><span><span class="code">${esc(x.code)}</span><span class="sub">${esc(x.name)}</span></span><span class="hide">${esc(x.inspector)}</span><span class="hide">${x.findings} temuan</span><span>${cond(x.condition)}<span class="sub">${esc(x.follow)}</span></span></button>`).join(''):`<div class="empty"><strong>Belum ada riwayat inspeksi</strong>Selesaikan satu inspeksi untuk melihat catatannya di sini.</div>`}function openRecord(id){record=history.find(x=>x.id===id);view='historyDetail';draw()}function historyDetail(a){if(!record)return go('history');a.innerHTML=`<button class="back" onclick="go('history')">â† Kembali ke riwayat</button><div class="panel" style="max-width:920px;margin:auto"><div class="hd"><div class="dhead"><div><h2>${esc(record.code)} Â· Detail inspeksi</h2><p>${esc(record.date)} Â· ${esc(record.inspector)}</p></div>${cond(record.condition)}</div></div><div class="body"><div class="review"><div><h3 style="margin-top:0">Bukti foto</h3>${record.photo?`<img class="preview" src="${record.photo}" alt="Bukti foto ${esc(record.code)}"><div class="meta">Diambil ${esc(record.captured||record.date)}</div>`:'<p class="sub">Foto tidak tersedia pada catatan lama.</p>'}</div><div><h3 style="margin-top:0">Jawaban checklist</h3><div class="panel">${Object.keys(record.answers||{}).length?items().map(x=>`<div class="row"><span class="ico">${flagged(record.answers[x[0]])?'!':'âœ“'}</span><span class="grow"><span class="code">${x[1]}</span><span class="sub">${esc(record.answers[x[0]])}</span></span></div>`).join(''):'<div class="empty">Data checklist tidak tersedia untuk catatan lama.</div>'}</div></div></div></div></div>`}
function recap(a){let n=c=>assets.filter(x=>x[I.condition]===c).length,open=assets.filter(x=>x[I.follow]==='Terbuka').length;a.innerHTML=head('Rekap Inspeksi','Ringkasan untuk keputusan dan tindak lanjut.','<button class="btn outline" onclick="window.print()">Cetak rekap</button>')+`<div class="grid four">${[['Inspeksi tersimpan',history.length,'Data perangkat ini'],['Perlu tindak lanjut',open,'Temuan terbuka'],['Tidak layak digunakan',n('Tidak Layak Digunakan'),'Prioritas tinggi'],['Alat kondisi baik',n('Baik'),'Tetap inspeksi rutin']].map(x=>`<div class="panel metric"><label>${x[0]}</label><strong>${x[1]}</strong><span>${x[2]}</span></div>`).join('')}</div><div class="grid two" style="margin-top:16px"><div class="panel"><div class="hd"><h2>Distribusi kondisi alat</h2><p>Kondisi terkini dari aset K3</p></div><div class="body">${['Baik','Perlu Perhatian','Perlu Perbaikan','Tidak Layak Digunakan'].map(c=>`<div style="display:flex;justify-content:space-between;gap:12px">${cond(c)}<b>${n(c)} alat</b></div><div class="bar"><i style="width:${n(c)/assets.length*100}%;background:${c==='Baik'?'#137a47':c==='Perlu Perhatian'?'#d88910':c==='Perlu Perbaikan'?'#c55b00':'#c2342d'}"></i></div>`).join('')}</div></div><div class="panel"><div class="hd"><h2>Tindak lanjut terbuka</h2><p>Fokus penyelesaian sebelum jadwal berikutnya</p></div>${assets.filter(x=>x[I.follow]==='Terbuka').map(x=>row(x,`<span class="sub">${x[I.finding]}</span>`,cond(x[I.condition]))).join('')||'<div class="empty">Tidak ada tindak lanjut terbuka.</div>'}</div></div>`}
