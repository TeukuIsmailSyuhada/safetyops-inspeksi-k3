</style></head><body><div class="app"><aside class="side"><div class="brand"><span class="logo">✓</span>SafetyOps Inspect</div><p class="small">Sistem Inspeksi Alat K3</p><nav class="nav"><button onclick="go('dashboard')">Dashboard</button><button onclick="go('tools')">Daftar Alat</button><button onclick="go('history')">Riwayat</button><button onclick="go('recap')">Rekap</button></nav></aside><main class="main" id="app"></main><nav class="mobile"><button onclick="go('dashboard')">Beranda</button><button onclick="go('tools')">Alat</button><button onclick="go('history')">Riwayat</button><button onclick="go('recap')">Rekap</button></nav></div><script>
const tools=[['apar-rkt-01','APAR-RKT-01','APAR Dry Chemical 3 kg','Area Produksi A','Dekat Panel A-03','Aman'],['apar-gdg-01','APAR-GDG-01','APAR CO₂ 5 kg','Gudang Bahan Baku','Pintu Timur','Perlu Tindakan'],['apar-rkt-02','APAR-RKT-02','APAR Foam 6 L','Area Produksi B','Dekat Mesin Press','Aman'],['hyd-gdg-01','HYD-GDG-01','Hydrant Box','Gudang Bahan Baku','Koridor Utara','Kritis'],['p3k-ktr-01','P3K-KTR-01','Kotak P3K','Kantor Operasional','Lobi Lantai 1','Aman'],['eye-lab-01','EYE-LAB-01','Eyewash Station','Laboratorium','Pintu Masuk Lab','Perlu Tindakan']];let view='dashboard',selected=tools[0],step=1,photo='',answers={},note='';let history=JSON.parse(localStorage.getItem('so-history')||'[]');const q=[['cylinder','Kondisi tabung',['Baik','Perlu Perhatian','Tidak Baik']],['seal','Segel dan pin pengaman',['Terpasang','Tidak Terpasang']],['pressure','Indikator tekanan',['Normal','Tidak Normal']],['hose','Kondisi selang dan nozzle',['Baik','Perlu Perhatian','Tidak Baik']],['placement','Alat mudah dijangkau',['Ya','Tidak']]];const tag=s=>`<span class="badge ${s==='Aman'?'Aman':s==='Kritis'?'Kritis':'Perlu'}">${s}</span>`;const head=(t,d,b='')=>`<div class="top"><div><h1>${t}</h1><p>${d}</p></div>${b}</div>`;function status(){let v=Object.values(answers);if(v.some(x=>['Tidak Baik','Tidak Normal','Tidak'].includes(x)))return'Kritis';if(v.some(x=>['Perlu Perhatian','Tidak Terpasang'].includes(x)))return'Perlu Tindakan';return'Aman'}function go(x){view=x;render()}function detail(i){selected=tools.find(x=>x[0]===i);view='detail';render()}function inspect(){step=1;photo='';answers={};note='';view='inspect';render()}function render(){let a=document.querySelector('#app');if(view==='dashboard'){let bad=tools.filter(x=>x[5]!=='Aman');a.innerHTML=head('Dashboard','Ringkasan kondisi inspeksi alat K3 hari ini','<button class="btn" onclick="inspect()">Scan QR & Mulai Inspeksi</button>')+`<div class="grid g3">${[['Total alat',tools.length],['Perlu inspeksi',bad.length],['Temuan aktif',bad.length]].map(x=>`<div class="card stat"><span class="small">${x[0]}</span><div class="num">${x[1]}</div><p class="small">Data demo</p></div>`).join('')}</div><div class="grid g2" style="margin-top:16px"><div class="card"><div class="hd"><h2>Temuan prioritas</h2><p>Alat yang perlu ditindaklanjuti</p></div>${bad.map(x=>`<button class="row" onclick="detail('${x[0]}')"><span>🛡</span><span class="grow"><span class="code">${x[1]}</span><span class="small">${x[4]}</span></span>${tag(x[5])}</button>`).join('')}</div><div class="card"><div class="hd"><h2>Alur inspeksi</h2></div><div class="body"><p><b>1. Identifikasi</b><br>Scan QR atau pilih alat.</p><p><b>2. Dokumentasi</b><br>Ambil foto kondisi aktual.</p><p><b>3. Checklist</b><br>Isi hasil dan simpan inspeksi.</p></div></div></div>`}else if(view==='tools'){a.innerHTML=head('Daftar Alat','Pilih aset K3 untuk melihat detail atau memulai inspeksi','<button class="btn" onclick="inspect()">Scan QR demo</button>')+`<div class="card">${tools.map(x=>`<button class="row" onclick="detail('${x[0]}')"><span>🛡</span><span class="grow"><span class="code">${x[1]}</span><span class="small">${x[2]} · ${x[3]}</span></span>${tag(x[5])}</button>`).join('')}</div>`}else if(view==='detail'){a.innerHTML=`<button class="back" onclick="go('tools')">← Daftar Alat</button><div class="detail"><div class="card"><div class="body"><div style="display:flex;justify-content:space-between;gap:10px"><div><span class="small">${selected[1]}</span><h1 style="margin-top:5px">${selected[2]}</h1><p>📍 ${selected[3]} · ${selected[4]}</p></div>${tag(selected[5])}</div><div class="info"><div><span class="small">Jenis</span><b>APAR</b></div><div><span class="small">Inspeksi terakhir</span><b>19 Sep 2026</b></div><div><span class="small">Status</span><b>${selected[5]}</b></div></div></div></div><div class="card"><div class="body" style="text-align:center"><h2>Identitas QR alat</h2><p class="small">QR mewakili ${selected[1]}</p><div class="qr"></div><p><b>${selected[1]}</b></p><button class="btn out" onclick="window.print()">Cetak label QR</button><button class="btn" style="display:block;width:100%;margin-top:9px" onclick="inspect()">Mulai Inspeksi</button></div></div></div>`}else if(view==='inspect')inspection(a);else if(view==='result'){let s=status(),rec=s==='Kritis'?['Hentikan penggunaan alat sementara.','Hubungi vendor atau teknisi.','Lakukan inspeksi ulang.']:s==='Perlu Tindakan'?['Jadwalkan pemeriksaan komponen.','Pantau sampai inspeksi berikutnya.']:['Alat dapat tetap digunakan.','Lanjutkan inspeksi rutin.'];a.innerHTML=`<div class="card" style="max-width:620px;margin:auto"><div class="body"><span class="logo">✓</span><p>Hasil inspeksi tersimpan</p><h1>${selected[1]}</h1><div class="warn">${tag(s)}<h2 style="margin-top:12px">Rekomendasi</h2>${rec.map((x,i)=>`<p>${i+1}. ${x}</p>`).join('')}</div><div class="actions"><button class="btn out" onclick="go('dashboard')">Dashboard</button><button class="btn" onclick="go('history')">Lihat riwayat</button></div></div></div>`}else if(view==='history'){a.innerHTML=head('Riwayat Inspeksi','Catatan inspeksi yang telah disimpan')+`<div class="card">${history.length?history.map(x=>`<div class="row"><span>📋</span><span class="grow"><span class="code">${x.code}</span><span class="small">${x.date}</span></span>${tag(x.status)}</div>`).join(''):'<p class="body">Belum ada riwayat inspeksi.</p>'}</div>`}else{let n=s=>tools.filter(x=>x[5]===s).length;a.innerHTML=head('Rekap Inspeksi','Ringkasan kondisi alat berdasarkan data demo','<button class="btn out" onclick="window.print()">Cetak rekap</button>')+`<div class="grid g2"><div class="card"><div class="body"><h2>Ringkasan periode</h2><p>Total alat: <b>${tools.length}</b></p><p>Total inspeksi baru: <b>${history.length}</b></p></div></div><div class="card"><div class="body"><h2>Kondisi alat</h2>${['Aman','Perlu Tindakan','Kritis'].map(s=>`<p style="display:flex;justify-content:space-between">${tag(s)} <b>${n(s)} alat</b></p><div class="bar"><i style="width:${n(s)/tools.length*100}%;background:${s==='Aman'?'#15803d':s==='Kritis'?'#b91c1c':'#b45309'}"></i></div>`).join('')}</div></div></div>`}}function inspection(a){let pct=step/3*100;if(step===1)a.innerHTML=`<button class="back" onclick="detail('${selected[0]}')">← Batalkan inspeksi</button><div class="card"><div class="hd"><h2>Dokumentasi · ${selected[1]}</h2><div class="step"><span style="width:${pct}%"></span></div></div><div class="body"><h2>Foto kondisi aktual</h2><p>Foto wajib sebagai dokumentasi setiap inspeksi.</p><label class="photo">${photo?`<img src="${photo}">`:'📷<b style="margin-top:10px">Ambil foto kondisi alat</b><span class="small">Gunakan kamera perangkat.</span>'}<input class="hide" type="file" accept="image/*" capture="environment" onchange="take(event)"></label><div class="actions"><span></span><button class="btn" ${photo?'':'disabled'} onclick="step=2;render()">Lanjut ke checklist →</button></div></div></div>`;else if(step===2)a.innerHTML=`<div class="card"><div class="hd"><h2>Checklist APAR · ${selected[1]}</h2><div class="step"><span style="width:${pct}%"></span></div></div><div class="body">${q.map(x=>`<div class="question"><b>${x[1]}</b><div class="options">${x[2].map(o=>`<button class="${answers[x[0]]===o?'sel':''}" onclick="answers['${x[0]}']='${o}';render()">${o}</button>`).join('')}</div></div>`).join('')}${status()!=='Aman'&&Object.keys(answers).length?`<div class="warn"><b>Catatan temuan wajib</b><textarea oninput="note=this.value" placeholder="Jelaskan kondisi masalah...">${note}</textarea></div>`:''}<div class="actions"><button class="btn out" onclick="step=1;render()">← Sebelumnya</button><button class="btn" ${q.every(x=>answers[x[0]])&&(status()==='Aman'||note.trim())?'':'disabled'} onclick="step=3;render()">Review hasil →</button></div></div></div>`;else{let s=status();a.innerHTML=`<div class="card"><div class="hd"><h2>Review hasil · ${selected[1]}</h2><div class="step"><span style="width:${pct}%"></span></div></div><div class="body"><img class="photo" style="min-height:0;height:180px;object-fit:cover" src="${photo}"><div class="warn">${tag(s)}<p>${s==='Aman'?'Alat dapat tetap digunakan sesuai prosedur.':s==='Kritis'?'Hentikan penggunaan sementara dan hubungi teknisi.':'Jadwalkan pemeriksaan komponen.'}</p></div><div class="actions"><button class="btn out" onclick="step=2;render()">← Sebelumnya</button><button class="btn" onclick="save()">Simpan hasil inspeksi</button></div></div></div>`}}function take(e){let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{photo=r.result;render()};r.readAsDataURL(f)}function save(){let s=status();history.unshift({code:selected[1],status:s,date:new Date().toLocaleString('id-ID')});localStorage.setItem('so-history',JSON.stringify(history));selected[5]=s;view='result';render()}render();
</script><script>
let cameraStream=null,capturedAt='';
function stopCamera(){if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}}
async function openCamera(){try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});const video=document.querySelector('#camera-preview');if(video){video.srcObject=cameraStream;await video.play()}}catch(e){document.querySelector('#camera-message').textContent='Kamera tidak dapat diakses. Izinkan kamera pada browser lalu coba lagi.'}}
function capturePhoto(){const video=document.querySelector('#camera-preview'),canvas=document.createElement('canvas');canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0);photo=canvas.toDataURL('image/jpeg',0.85);capturedAt=new Date().toLocaleString('id-ID');stopCamera();render()}
window.inspect=function(){stopCamera();step=1;photo='';capturedAt='';answers={};note='';view='inspect';render()}
window.inspection=function(a){let pct=step/3*100;if(step===1){a.innerHTML=`<button class="back" onclick="detail('${selected[0]}')">← Batalkan inspeksi</button><div class="card"><div class="hd"><h2>Dokumentasi · ${selected[1]}</h2><div class="step"><span style="width:${pct}%"></span></div></div><div class="body"><h2>Foto kondisi aktual</h2><p>Foto wajib diambil langsung dari kamera. Waktu pengambilan ikut disimpan sebagai metadata.</p>${photo?`<div class="photo"><img src="${photo}"></div><p class="small">Diambil: ${capturedAt}</p><button class="btn out" onclick="photo='';capturedAt='';render()">Foto ulang</button>`:`<div class="photo"><video id="camera-preview" autoplay playsinline style="display:none;width:100%;max-height:300px;object-fit:cover;border-radius:8px"></video><span id="camera-message">Aktifkan kamera belakang untuk memotret kondisi alat.</span><button class="btn" style="margin-top:14px" onclick="document.querySelector('#camera-preview').style.display='block';openCamera()">Aktifkan Kamera</button><button class="btn out" style="margin-top:8px" onclick="capturePhoto()">Ambil Foto</button></div>`}<div class="actions"><span></span><button class="btn" ${photo?'':'disabled'} onclick="step=2;render()">Lanjut ke checklist →</button></div></div></div>`;return}return window._oldInspection(a)}
window._oldInspection=inspection;inspection=window.inspection;
const oldSave=save;save=function(){stopCamera();let s=status();history.unshift({code:selected[1],status:s,date:new Date().toLocaleString('id-ID'),capturedAt});localStorage.setItem('so-history',JSON.stringify(history));selected[5]=s;view='result';render()}
</script><style id="industrial-ui-refresh">

ild(3){border-top-color:#c23c31}.num{font-size:30px;line-height:1;margin:9px 0 7px}.small{font-size:12px;color:var(--muted)}.row{width:100%;background:#fff;border:0;border-bottom:1px solid var(--line);padding:14px 17px;text-align:left;transition:background .15s}.row:hover{background:#f5f8fc}.row>span:first-child{width:27px;height:27px;border:1px solid #cbd8e9;border-radius:4px;display:grid;place-items:center;background:#f3f7fd}.code{display:block;font-size:13px;letter-spacing:.025em}.row .small{display:block;margin-top:3px}.badge{border-radius:4px;padding:4px 7px;font-size:11px;white-space:nowrap}.badge:before{margin-right:4px;font-weight:800}.badge.Aman:before{content:"✓"}.badge.Perlu:before{content:"!"}.badge.Kritis:before{content:"×"}.detail{gap:18px;grid-template-columns:minmax(0,1fr) 310px}.detail>.card:first-of-type{border-top:3px solid #1769e0}.info{gap:0;margin-top:20px;padding-top:0;border-top:0;background:#f6f8fb;border:1px solid #e0e7ef;border-radius:5px}.info>div{padding:13px 15px;border-right:1px solid #e0e7ef}.info>div:last-child{border:0}.info b{display:block;margin-top:4px;font-size:13px}.qr{width:158px;height:158px;border:7px solid #fff;box-shadow:0 0 0 1px #cbd5e1}.step{height:6px;margin-top:13px;background:#e4eaf2;border-radius:0}.step span{background:var(--blue)}.photo{min-height:250px;border:1px dashed #8da4c2;border-radius:5px;background:#f7f9fc}.photo img{border-radius:4px}.question{padding:16px 0}.question>b{font-size:14px}.options button{border-radius:4px;border-color:#c7d2e0;padding:8px 11px;font-size:13px}.options button:hover{border-color:#7da9ed}.options button.sel{background:#eaf3ff;border-color:#2573e8;color:#104b9e;box-shadow:inset 0 0 0 1px #2573e8}.warn{border-radius:5px}.actions{margin-top:18px;padding-top:15px}.back{font-size:13px;font-weight:600;color:#53647c}.bar{border-radius:2px;height:7px}.mobile{box-shadow:0 -1px 8px rgba(15,31,55,.08)}.ops-context{display:flex;align-items:center;gap:8px;background:#e9f3ff;border:1px solid #cde1fb;padding:8px 11px;border-radius:5px;color:#1c508d;font-size:12px;margin:-4px 0 16px}.ops-context:before{content:"●";font-size:11px;color:#1c9b62}.ops-context b{font-size:12px}.camera-actions{display:flex;gap:8px;margin-top:16px}.camera-actions .btn{flex:1}.capture-meta{display:flex;align-items:center;gap:7px;margin:10px 0 0;color:#52647a;font-size:12px}.capture-meta:before{content:"◷";font-size:15px;color:#2a6fc9}.inspection-title{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.inspection-title .small{margin-top:4px}.capture-tip{padding:10px 12px;background:#edf5ff;border-left:3px solid #3b82f6;color:#31506f;font-size:12px;margin:15px 0 0}.capture-tip b{color:#204b80}.status-key{display:flex;gap:12px;align-items:center;color:#66758a;font-size:11px;margin-top:10px}.status-key span{display:flex;align-items:center;gap:4px}.status-key i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#157a4b}.status-key .amber-dot{background:#d88910}.status-key .red-dot{background:#c23c31}@media(max-width:700px){.main{padding:17px 16px 78px}.top h1{font-size:22px}.top{margin-bottom:17px}.card .body{padding:15px}.detail{gap:14px}.info{grid-template-columns:1fr}.info>div{border-right:0;border-bottom:1px solid #e0e7ef}.info>div:last-child{border-bottom:0}.camera-actions{flex-direction:column}.camera-actions .btn{width:100%}.photo{min-height:230px}.mobile button{font-weight:600}.mobile button:before{display:block;font-size:16px;line-height:19px}.mobile button:nth-child(1):before{content:"▦"}.mobile button:nth-child(2):before{content:"▤"}.mobile button:nth-child(3):before{content:"◷"}.mobile button:nth-child(4):before{content:"▥"}}
</style><script>
let cameraReady=false;
stopCamera=function(){if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}cameraReady=false};
openCamera=async function(){const message=document.querySelector('#camera-message'),video=document.querySelector('#camera-preview');try{if(message)message.textContent='Menyalakan kamera…';cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});if(video){video.style.display='block';video.srcObject=cameraStream;await video.play();cameraReady=true;if(message)message.textContent='Kamera siap. Arahkan ke alat, lalu ambil foto.'}}catch(e){stopCamera();if(message)message.textContent='Kamera tidak dapat diakses. Izinkan kamera pada browser lalu coba lagi.'}};
capturePhoto=function(){const video=document.querySelector('#camera-preview'),message=document.querySelector('#camera-message');if(!cameraReady||!video||video.readyState<2){if(message)message.textContent='Aktifkan kamera dan tunggu sampai preview tampil sebelum mengambil foto.';return}const canvas=document.createElement('canvas');canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0);photo=canvas.toDataURL('image/jpeg',.85);capturedAt=new Date().toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'});stopCamera();render()};
inspect=function(){stopCamera();step=1;photo='';capturedAt='';answers={};note='';view='inspect';render()};
inspection=function(a){if(step!==1)return window._oldInspection(a);const pct=step/3*100;a.innerHTML=`<button class="back" onclick="stopCamera();detail('${selected[0]}')">← Batalkan inspeksi</button><div class="card"><div class="hd"><div class="inspection-title"><div><h2>Dokumentasi kondisi</h2><p class="small">Aset ${selected[1]} · Langkah 1 dari 3</p></div><span class="badge Perlu">Wajib foto</span></div><div class="step"><span style="width:${pct}%"></span></div></div><div class="body"><h2>Foto kondisi aktual</h2><p>Dokumentasi diambil langsung dari kamera perangkat dan disimpan bersama waktu pengambilan.</p>${photo?`<div class="photo"><img src="${photo}" alt="Foto kondisi ${selected[1]}"></div><div class="capture-meta">Diambil ${capturedAt}</div><div class="camera-actions"><button class="btn out" onclick="photo='';capturedAt='';render()">Ambil ulang</button><button class="btn" onclick="step=2;render()">Lanjut ke checklist →</button></div>`:`<div class="capture-tip"><b>Petunjuk:</b> pastikan label aset dan kondisi alat terlihat jelas dalam satu foto.</div><div class="photo"><video id="camera-preview" autoplay playsinline style="display:none;width:100%;max-height:310px;object-fit:cover;border-radius:4px"></video><span id="camera-message">Aktifkan kamera belakang untuk memotret kondisi alat.</span><div class="camera-actions"><button class="btn" onclick="openCamera()">Aktifkan kamera</button><button class="btn out" onclick="capturePhoto()">Ambil foto</button></div></div><div class="actions"><span class="small">Foto wajib sebelum checklist dapat dilanjutkan.</span><button class="btn" disabled>Lanjut ke checklist →</button></div>`}</div></div>`};
save=function(){stopCamera();const s=status();history.unshift({code:selected[1],status:s,date:new Date().toLocaleString('id-ID'),capturedAt});localStorage.setItem('so-history',JSON.stringify(history));selected[5]=s;view='result';render()};
const initialRender=render;render=function(){initialRender();const root=document.querySelector('#app');if(!root)return;document.querySelectorAll('.nav button').forEach(button=>button.classList.toggle('on',button.getAttribute('onclick')===`go('${view}')`));if(view==='dashboard'&&!root.querySelector('.ops-context')){const top=root.querySelector('.top');if(top)top.insertAdjacentHTML('afterend','<div class="ops-context"><b>Operasional hari ini</b><span>Pastikan semua temuan prioritas ditindaklanjuti sebelum akhir shift.</span></div>')}if(view==='recap'&&!root.querySelector('.status-key')){const card=root.querySelector('.card .body');if(card)card.insertAdjacentHTML('beforeend','<div class="status-key"><span><i></i>Aman</span><span><i class="amber-dot"></i>Perlu tindakan</span><span><i class="red-dot"></i>Kritis</span></div>')}};render();
</script><script>
const inspectionItems=[
 ['cylinder','Kondisi fisik tabung','Tidak ada penyok, karat, kebocoran, atau kerusakan terlihat.',['Baik','Perlu Perhatian','Tidak Baik']],
 ['seal','Segel dan pin pengaman','Segel utuh dan pin pengaman terpasang.',['Terpasang','Tidak Terpasang']],
 ['pressure','Indikator tekanan','Jarum manometer berada pada zona hijau.',['Normal','Tidak Normal']],
 ['hose','Selang dan nozzle','Selang tidak retak; nozzle bersih dan tidak tersumbat.',['Baik','Perlu Perhatian','Tidak Baik']],
 ['placement','Akses dan penempatan','Alat terlihat, mudah dijangkau, dan jalur tidak terhalang.',['Ya','Tidak']],
 ['label','Label dan masa berlaku','Label inspeksi terbaca dan masa berlaku masih sesuai.',['Berlaku','Mendekati jatuh tempo','Lewat jatuh tempo']]
];
status=function(){const values=Object.values(answers);if(values.some(value=>['Tidak Baik','Tidak Normal','Tidak','Lewat jatuh tempo'].includes(value)))return'Kritis';if(values.some(value=>['Perlu Perhatian','Tidak Terpasang','Mendekati jatuh tempo'].includes(value)))return'Perlu Tindakan';return'Aman'};
function answerInspection(key,value){answers[key]=value;render()}
const photoDocumentationStep=inspection;
inspection=function(a){if(step===1)return photoDocumentationStep(a);const pct=step/3*100;if(step===2){const completed=inspectionItems.filter(item=>answers[item[0]]).length;const currentStatus=status();const noteRequired=currentStatus!=='Aman'&&completed>0;const reviewReady=completed===inspectionItems.length&&(!noteRequired||note.trim());a.innerHTML=`<button class="back" onclick="step=1;render()">← Kembali ke dokumentasi</button><div class="card"><div class="hd"><div class="inspection-title"><div><h2>Checklist kondisi APAR</h2><p class="small">Aset ${selected[1]} · Langkah 2 dari 3 · ${completed}/${inspectionItems.length} item terisi</p></div>${completed?tag(currentStatus):'<span class="small">Belum dinilai</span>'}</div><div class="step"><span style="width:${pct}%"></span></div></div><div class="body"><div class="capture-tip"><b>Isi sesuai kondisi aktual.</b> Pilih kondisi yang paling tepat untuk setiap poin; status akhir dihitung otomatis dari jawaban.</div>${inspectionItems.map((item,index)=>`<div class="question"><div style="display:flex;gap:10px"><span class="small" style="min-width:20px;font-weight:700;color:#1d65c1">${index+1}</span><div class="grow"><b>${item[1]}</b><p class="small">${item[2]}</p><div class="options">${item[3].map(option=>`<button class="${answers[item[0]]===option?'sel':''}" onclick="answerInspection('${item[0]}','${option}')">${option}</button>`).join('')}</div></div></div></div>`).join('')}${noteRequired?`<div class="warn"><b>Catatan temuan wajib</b><p class="small">Jelaskan kondisi yang perlu ditindaklanjuti agar tim berikutnya mendapat konteks yang cukup.</p><textarea oninput="note=this.value" placeholder="Contoh: Segel tidak terpasang; mohon penggantian sebelum inspeksi berikutnya.">${note}</textarea></div>`:''}<div class="actions"><button class="btn out" onclick="step=1;render()">← Sebelumnya</button><button class="btn" ${reviewReady?'':'disabled'} onclick="step=3;render()">Review hasil →</button></div></div></div>`;return}const finalStatus=status();a.innerHTML=`<button class="back" onclick="step=2;render()">← Kembali ke checklist</button><div class="card"><div class="hd"><div class="inspection-title"><div><h2>Review hasil inspeksi</h2><p class="small">Aset ${selected[1]} · Langkah 3 dari 3</p></div>${tag(finalStatus)}</div><div class="step"><span style="width:${pct}%"></span></div></div><div class="body"><div class="grid g2"><div><h2>Dokumentasi</h2><img class="photo" style="min-height:0;height:190px;object-fit:cover;margin-top:10px" src="${photo}" alt="Dokumentasi kondisi ${selected[1]}"><div class="capture-meta">Diambil ${capturedAt}</div></div><div><h2>Ringkasan checklist</h2><div class="card" style="margin-top:10px">${inspectionItems.map(item=>`<div class="row"><span>${answers[item[0]]==='Baik'||answers[item[0]]==='Terpasang'||answers[item[0]]==='Normal'||answers[item[0]]==='Ya'||answers[item[0]]==='Berlaku'?'✓':'!'}</span><span class="grow"><span class="code">${item[1]}</span><span class="small">${answers[item[0]]}</span></span></div>`).join('')}</div></div></div><div class="warn"><b>Status: ${finalStatus}</b><p>${finalStatus==='Aman'?'Seluruh checklist lulus. Alat dapat tetap digunakan sesuai SOP.':finalStatus==='Kritis'?'Ada kondisi kritis. Hentikan penggunaan alat sementara dan segera hubungi penanggung jawab K3/teknisi.':'Ada item yang perlu ditindaklanjuti. Jadwalkan pemeriksaan atau penggantian komponen.'}</p>${note?`<p><b>Catatan:</b> ${note}</p>`:''}</div><div class="actions"><button class="btn out" onclick="step=2;render()">← Ubah checklist</button><button class="btn" onclick="save()">Simpan hasil inspeksi</button></div></div></div>`};
render();
</script></body></html>
