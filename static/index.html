<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1e40af"><meta name="description" content="Inspeksi alat K3 berbasis QR: scan, foto, checklist, dan tindak lanjut."><title>SafetyOps Inspect</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
/* Design system: Flat solid — warna solid penuh untuk status & navigasi (teks putih, kontras ≥4.5:1), IBM Plex. */
:root{
--primary:#1d4ed8;--primary-hover:#1e40af;--side:#1e3a8a;--primary-soft:#eff6ff;--primary-line:#bfdbfe;--ring:#2563eb;
--bg:#eef2f7;--surface:#fff;--sunken:#f1f5f9;--text:#0f172a;--muted:#475569;--subtle:#64748b;--line:#e2e8f0;--line-strong:#cbd5e1;
--ok:#15803d;--ok-bg:#f0fdf4;--ok-line:#bbf7d0;
--warn:#b45309;--warn-bg:#fffbeb;--warn-line:#fde68a;
--fix:#c2410c;--fix-bg:#fff7ed;--fix-line:#fed7aa;
--bad:#b91c1c;--bad-bg:#fef2f2;--bad-line:#fecaca;
--info:#1d4ed8;--info-bg:#eff6ff;--info-line:#bfdbfe;
--r:8px;--r-lg:12px;--sd:248px;
--sans:'IBM Plex Sans',system-ui,"Segoe UI",Arial,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
--sh:none;--sh-lg:0 12px 32px rgb(15 23 42/.16);
--z-sticky:5;--z-nav:20;--z-auth:50;--z-toast:60;
}
*{box-sizing:border-box}
html{color-scheme:light;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{line-height:1.25;margin:0}
p{margin:0}
.ic{flex:none}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
#app:focus{outline:none}
.skip{position:absolute;left:12px;top:-80px;z-index:var(--z-toast);padding:10px 16px;border-radius:var(--r);background:var(--primary);color:#fff;font-weight:600}
.skip:focus{top:12px}

/* ---------- SHELL ---------- */
.shell{min-height:100vh;padding-left:var(--sd)}
.side{position:fixed;inset:0 auto 0 0;z-index:var(--z-nav);width:var(--sd);display:flex;flex-direction:column;padding:20px 14px;overflow-y:auto;background:var(--side);color:#fff}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px;color:var(--text);font-weight:700;font-size:17px;letter-spacing:-.01em;line-height:1.2}
.brand small{display:block;color:var(--muted);font-size:13px;font-weight:500;letter-spacing:0}
.logo{display:grid;place-items:center;width:38px;height:38px;flex:none;border-radius:10px;background:var(--primary);color:#fff}
.side .brand,.mtop .brand{color:#fff}.side .brand small{color:#bfdbfe}.side .logo,.mtop .logo{background:#fff;color:var(--side)}
.side .cta{width:100%;margin-top:24px;border-color:#fff;background:#fff;color:var(--side)}.side .cta:hover{border-color:#dbeafe;background:#dbeafe}
.navtitle{margin:24px 10px 6px;color:#93c5fd;font-size:13px;font-weight:600}
.nav button{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:46px;margin:2px 0;padding:10px 12px;border:0;border-radius:var(--r);background:transparent;color:#dbeafe;font-weight:600;font-size:15px;text-align:left;cursor:pointer;transition:background .15s,color .15s}
.nav button:hover{background:#1e40af;color:#fff}
.nav button.on{background:#fff;color:var(--side)}
.subside{margin-top:auto;padding:16px 6px 0;border-top:1px solid #1e40af;color:#bfdbfe;font-size:14px}.subside .sub{color:#bfdbfe}
.side .user b{color:#fff}.side .avatar{background:#fff;color:var(--side)}
.user{display:flex;gap:10px;align-items:center;min-width:0}
.user b{display:block;overflow:hidden;color:var(--text);font-size:15px;white-space:nowrap;text-overflow:ellipsis}
.user .grow>span{display:block;font-size:13px}
.avatar{display:grid;place-items:center;width:38px;height:38px;flex:none;border-radius:50%;background:var(--primary-soft);color:var(--primary);font-weight:700;font-size:14px}
.signout{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;margin-top:12px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.signout:hover{border-color:var(--bad);background:var(--bad);color:#fff}
.side .signout{border-color:#3b5bdb;background:transparent;color:#fff}.side .signout:hover{border-color:var(--bad);background:var(--bad)}
.mtop{display:none}
.main{max-width:1280px;margin:0 auto;padding:32px 32px 64px}

/* ---------- PAGE HEAD ---------- */
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px}
.top h1{font-size:28px;font-weight:700;letter-spacing:-.02em}
.top p{margin-top:6px;color:var(--muted);font-size:15px}
.topbtns{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- BUTTONS ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border:1px solid var(--primary);border-radius:var(--r);background:var(--primary);color:#fff;font-weight:600;font-size:15px;line-height:1.2;text-align:center;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.btn:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn:active{transform:translateY(1px)}
.btn:disabled{border-color:var(--line-strong);background:var(--line-strong);color:var(--muted);cursor:not-allowed;transform:none}
.btn.outline{border-color:var(--line-strong);background:var(--surface);color:var(--text)}
.btn.outline:hover{background:var(--sunken)}
.btn.outline:disabled{border-color:var(--line);background:var(--surface);color:var(--subtle)}
.btn.danger{border-color:var(--bad);background:var(--bad);color:#fff}
.btn.danger:hover{border-color:#991b1b;background:#991b1b}
.btn.lg{min-height:52px;padding:12px 22px;font-size:16px}
.btn.block{display:flex;width:100%}
.link{min-height:44px;padding:0;border:0;background:none;color:var(--primary);font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.link.inline{min-height:0;font-size:inherit}

/* ---------- LAYOUT + PANELS ---------- */
.grid{display:grid;gap:16px}
.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.dash{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}
.stack{display:grid;gap:16px;align-content:start}
.panel{overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh)}
@supports(overflow:clip){.panel{overflow:clip}}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.hd h2{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:600}
.hd h2 .ic{color:var(--primary)}
.hd{background:var(--surface)}
.hd p{margin-top:4px;color:var(--muted);font-size:14px}
.body{padding:20px}
.count{padding:2px 10px;border-radius:999px;background:var(--primary);color:#fff;font-family:var(--mono);font-size:13px;font-weight:600;white-space:nowrap}
.grow{flex:1;min-width:0}
.sub{display:block;color:var(--muted);font-size:14px}
.code{display:block;color:var(--text);font-family:var(--mono);font-weight:600;font-size:14px}
.label{display:block;margin-bottom:4px;color:var(--muted);font-size:13px;font-weight:600}
.h3{margin:0 0 10px;font-size:15px;font-weight:600}

/* ---------- KPI TILES ---------- */
.kpi{display:flex;align-items:center;gap:14px;width:100%;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);text-align:left;transition:border-color .15s,box-shadow .15s}
button.kpi{cursor:pointer}
button.kpi:hover{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.kpi>.ic{color:var(--subtle)}
.kpi-ic{display:grid;place-items:center;width:48px;height:48px;flex:none;border-radius:12px;color:#fff}
.kpi-tx{flex:1;min-width:0}
.kpi-l{display:block;color:var(--muted);font-size:14px;font-weight:600}
.kpi strong{display:block;margin:4px 0 2px;font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi-s{display:block;color:var(--muted);font-size:13px}
.k-info .kpi-ic{background:var(--info)}
.k-ok .kpi-ic{background:var(--ok)}
.k-warn .kpi-ic{background:var(--warn)}
.k-fix .kpi-ic{background:var(--fix)}
.k-bad .kpi-ic{background:var(--bad)}

/* ---------- BANNERS + HINTS ---------- */
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:16px;padding:14px 16px;border:0;border-radius:var(--r-lg);color:#fff;font-size:15px}
.banner b{display:block}
.banner .btn{flex:none}
.banner.ok{background:var(--ok)}
.banner.warn{background:var(--warn)}
.banner.fix{background:var(--fix)}
.banner.bad{background:var(--bad)}
.banner.info{background:var(--info)}
.banner .btn.outline{border-color:#fff;background:#fff;color:var(--text)}.banner .btn.outline:hover{background:#f1f5f9}
.hint{display:flex;gap:10px;align-items:flex-start;margin:16px 0;padding:12px 14px;border:1px solid var(--line);border-left:4px solid var(--info);border-radius:var(--r);background:var(--surface);color:var(--text);font-size:14px}
.hint>.ic,.notice>.ic{color:var(--info)}
.hint .ic{margin-top:1px}
.notice{display:flex;gap:10px;align-items:flex-start;margin-bottom:16px;padding:12px 14px;border:1px solid var(--line);border-left:4px solid var(--info);border-radius:var(--r);background:var(--surface);color:var(--text);font-size:14px}

/* ---------- STATUS PILLS (icon + text, never colour alone) ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border:1px solid var(--muted);border-radius:999px;background:var(--muted);color:#fff;font-size:13px;font-weight:600;line-height:1.4;white-space:nowrap}
.good{border-color:var(--ok);background:var(--ok);color:#fff}
.attention{border-color:var(--warn);background:var(--warn);color:#fff}
.repair{border-color:var(--fix);background:var(--fix);color:#fff}
.unsafe,.overdue{border-color:var(--bad);background:var(--bad);color:#fff}
.due{border-color:var(--info);background:var(--info);color:#fff}
.pills{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:6px}

/* ---------- LIST ROWS ---------- */
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 20px;border:0;border-bottom:1px solid var(--line);background:var(--surface);text-align:left;transition:background .15s}
.row:last-child{border-bottom:0}
.click{cursor:pointer}
.click:hover{background:var(--sunken)}
.row>.ic{color:var(--subtle)}
.row.more{justify-content:center;min-height:52px;color:var(--primary);font-weight:600}
.row.more .ic{color:var(--primary)}
.rowtitle{display:block;font-size:15px;font-weight:600}
.rownote{display:block;margin-top:4px;color:var(--text);font-size:14px}
.ico{display:grid;place-items:center;width:40px;height:40px;flex:none;border-radius:10px;background:var(--sunken);color:var(--muted)}
.ico.t-good{background:var(--ok);color:#fff}
.ico.t-attention{background:var(--warn);color:#fff}
.ico.t-repair{background:var(--fix);color:#fff}
.ico.t-unsafe{background:var(--bad);color:#fff}

/* ---------- PRIORITY (AI) LIST ---------- */
.prow{display:flex;align-items:flex-start;gap:14px;width:100%;padding:16px 20px;border:0;border-bottom:1px solid var(--line);background:var(--surface);text-align:left;cursor:pointer;transition:background .15s}
.prow:hover{background:var(--sunken)}
.prow-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.rank{display:grid;place-items:center;width:30px;height:30px;flex:none;border-radius:8px;background:var(--sunken);color:var(--text);font-family:var(--mono);font-size:14px;font-weight:600}
.rank.r-unsafe{background:var(--bad);color:#fff}
.rank.r-repair{background:var(--fix);color:#fff}
.rank.r-attention{background:var(--warn);color:#fff}
.finding{display:block;margin-top:6px;font-size:15px}
.todo{display:flex;gap:8px;align-items:flex-start;margin-top:8px;padding:10px 12px;border-radius:var(--r);background:var(--sunken);color:var(--text);font-size:14px}
.todo .ic{margin-top:2px;color:var(--primary)}
.aibadge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--info);border-radius:999px;background:var(--info);color:#fff;font-size:13px;font-weight:600;white-space:nowrap}
.aifoot{display:flex;gap:8px;align-items:flex-start;padding:12px 20px;border-top:1px solid var(--line);background:var(--sunken);color:var(--muted);font-size:13px}
.aifoot .ic{margin-top:1px}

/* ---------- DISTRIBUTION BARS ---------- */
.stackbar{display:flex;gap:2px;height:12px;margin-bottom:12px;overflow:hidden;border-radius:999px;background:var(--sunken)}
.stackbar i{display:block;height:100%}
.distbtn{display:block;margin:0 -8px;padding:8px;border:0;border-radius:var(--r);background:transparent;text-align:left;cursor:pointer;width:calc(100% + 16px)}
.distbtn:hover{background:var(--sunken)}
.dist{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
.dist b{font-size:14px;font-variant-numeric:tabular-nums}
.bar{height:8px;overflow:hidden;border-radius:999px;background:var(--sunken)}
.bar i{display:block;height:100%;border-radius:999px;transition:width .3s ease}
.locrow{padding:8px 0}
.locrow .dist span{font-size:15px;font-weight:600}

/* ---------- SEARCH + FILTERS ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;padding:16px 20px 12px}
.searchbox{position:relative;flex:1;min-width:240px}
.searchbox>.ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--subtle);pointer-events:none}
.field{height:44px;min-width:160px;padding:0 12px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);color:var(--text);font-size:15px}
.field:hover{border-color:var(--subtle)}
.field:focus{outline:3px solid rgb(37 99 235/.25);outline-offset:0;border-color:var(--ring)}
select.field{cursor:pointer}
.search{width:100%;padding-left:40px}
.chips{display:flex;gap:8px;padding:0 20px 12px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;flex:none;min-height:44px;padding:0 14px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.chip:hover{border-color:var(--subtle);color:var(--text)}
.chip span{color:var(--subtle);font-family:var(--mono);font-size:13px}
.chip.on{border-color:var(--primary);background:var(--primary);color:#fff}
.chip.on span{color:#dbeafe}
.adv{display:flex;flex-wrap:wrap;gap:10px;padding:0 20px 16px}
.adv .field{flex:1}
.filt-toggle{display:none}
.rescount{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;padding:6px 20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--sunken);color:var(--muted);font-size:14px}
.rescount b{color:var(--text)}

/* ---------- ASSET DETAIL ---------- */
.detail{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.dhead h1{margin:4px 0 6px;font-size:26px;font-weight:700;letter-spacing:-.02em}
.metaline{display:flex;flex-wrap:wrap;align-items:center;gap:6px;color:var(--muted);font-size:15px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;margin-top:20px;overflow:hidden;border:1px solid var(--line);border-radius:var(--r);background:var(--line)}
.fact{padding:14px 16px;background:var(--surface)}
.fact strong{display:block;font-size:15px}
.ctarow{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.back{display:inline-flex;align-items:center;gap:8px;min-height:44px;margin:-8px 0 12px -6px;padding:0 6px;border:0;border-radius:var(--r);background:transparent;color:var(--muted);font-size:15px;font-weight:600;cursor:pointer}
.back:hover{color:var(--primary)}
.qrcard .body{text-align:center}
.qrcard p{margin-top:4px}
.qr{display:grid;place-items:center;width:172px;height:172px;margin:16px auto 10px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.qr-actions{display:grid;gap:8px;margin-top:16px}
.fl{display:grid;gap:6px;font-size:14px;font-weight:600}
.fl .field{width:100%;min-width:0}
.fl i{color:var(--bad);font-style:normal}

/* ---------- INSPECTION FLOW ---------- */
.flowwrap{max-width:760px;margin:0 auto}
.flowwrap.wide{max-width:980px}
.stepper{display:flex;gap:8px;margin:0 0 20px;padding:0;list-style:none}
.stepper li{display:flex;flex:1;flex-direction:column;gap:8px;color:var(--subtle);font-size:14px;font-weight:600}
.stepper li:before{content:"";height:4px;border-radius:999px;background:var(--line)}
.stepper li.done:before,.stepper li.now:before{background:var(--primary)}
.stepper li.done{color:var(--text)}
.stepper li.now{color:var(--primary)}
.stepper .sl{display:flex;align-items:center;gap:6px}
.stepper .dot{display:grid;place-items:center;width:24px;height:24px;flex:none;border:1.5px solid currentColor;border-radius:50%;font-size:12px}
.stepper li.done .dot,.stepper li.now .dot{border-color:var(--primary);background:var(--primary);color:#fff}
.assetchip{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunken)}
.camera{position:relative;display:flex;align-items:center;justify-content:center;min-height:340px;overflow:hidden;border-radius:var(--r);background:#0f172a;color:#e2e8f0;text-align:center}
.camera video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cammsg{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;max-width:340px;padding:24px;font-size:16px}
.cammsg .ic{margin-bottom:8px;color:#94a3b8}
.cammsg .sub{color:#cbd5e1}
.frame{position:absolute;width:min(62%,260px);aspect-ratio:1;border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 999px rgb(15 23 42/.45)}
.framehint{position:absolute;bottom:14px;left:50%;padding:6px 12px;border-radius:999px;background:rgb(15 23 42/.85);color:#fff;font-size:13px;white-space:nowrap;transform:translateX(-50%)}
.actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;margin-top:16px}
.preview{display:block;width:100%;max-height:360px;object-fit:cover;border:1px solid var(--line);border-radius:var(--r);background:var(--sunken)}
.meta{display:flex;align-items:center;gap:6px;margin-top:8px;color:var(--muted);font-size:14px}
.section h3{margin:20px 0 0;color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.question{padding:16px 0;border-bottom:1px solid var(--line)}
.section .question:last-child{border-bottom:0}
.question.flag{margin:0 -12px;padding:16px 12px;border-left:4px solid var(--warn);border-radius:var(--r);background:var(--warn-bg)}
.qtop{display:flex;gap:12px}
.qnum{display:grid;place-items:center;width:26px;height:26px;flex:none;border-radius:50%;background:var(--sunken);color:var(--muted);font-size:13px;font-weight:700}
.question.done .qnum{background:var(--primary-soft);color:var(--primary)}
.question b{font-size:16px;font-weight:600}
.question p{margin-top:2px;color:var(--muted);font-size:14px}
.answers{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0 38px}
.answer{display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:8px 16px;border:1.5px solid var(--line-strong);border-radius:var(--r);background:var(--surface);font-size:15px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.answer:hover{border-color:var(--subtle)}
.answer.sel.t-ok{border-color:var(--ok);background:var(--ok);color:#fff}
.answer.sel.t-warn{border-color:var(--warn);background:var(--warn);color:#fff}
.answer.sel.t-fix{border-color:var(--fix);background:var(--fix);color:#fff}
.answer.sel.t-bad{border-color:var(--bad);background:var(--bad);color:#fff}
.notelabel{display:block;margin:14px 0 6px 38px;font-size:14px;font-weight:600}
.notelabel i{color:var(--bad);font-style:normal}

.question textarea:focus{outline:3px solid rgb(37 99 235/.25);outline-offset:0;border-color:var(--ring)}
.sticky{position:sticky;bottom:0;z-index:var(--z-sticky);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin:20px -20px -20px;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface)}

.cstat{min-width:180px;color:var(--muted);font-size:14px}

.minibar{max-width:240px;height:6px;margin-top:6px;overflow:hidden;border-radius:999px;background:var(--sunken)}

.review{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:20px}
.resulthead{display:flex;align-items:flex-start;gap:16px}

.bigic{display:grid;place-items:center;width:60px;height:60px;flex:none;border-radius:50%}

.t-warn.bigic{background:var(--warn);color:#fff}
.t-fix.bigic{background:var(--fix);color:#fff}
.t-bad.bigic{background:var(--bad);color:#fff}
.box{margin-top:20px;padding:16px;border:1px solid var(--line);border-radius:var(--r)}
.box h2{margin-bottom:6px;font-size:18px}
.box p{margin-bottom:8px}

/* ---------- EMPTY / LOADING / TOAST ---------- */
.empty{padding:40px 20px;color:var(--muted);font-size:15px;text-align:center}
.empty strong{display:block;margin-bottom:6px;color:var(--text);font-size:16px}
.empty .ec{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 14px;border-radius:50%;background:var(--sunken);color:var(--muted)}
.loading{padding:56px 16px;text-align:center}
.loading h2{margin-bottom:6px;font-size:20px}
.spin{width:36px;height:36px;margin:0 auto 16px;border:3px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.skel{display:block;border-radius:var(--r);background:#dde3ec;animation:pulse 1.2s ease-in-out infinite}
.sk-kpi{height:98px}
.sk-card{height:320px}
@keyframes pulse{50%{opacity:.5}}
.bootmsg{display:flex;align-items:center;gap:10px;margin-bottom:16px;color:var(--muted);font-size:15px}
.bootmsg .spin{width:20px;height:20px;margin:0;border-width:2px}
.toast{position:fixed;left:50%;bottom:24px;z-index:var(--z-toast);display:flex;align-items:flex-start;gap:10px;width:max-content;max-width:min(440px,calc(100vw - 32px));padding:12px 16px;border-radius:var(--r);background:var(--text);color:#fff;font-size:14px;box-shadow:var(--sh-lg);transform:translateX(-50%);animation:toast .2s ease-out}
.toast.error{background:var(--bad)}
.toast .ic{margin-top:1px}
@keyframes toast{from{opacity:0;transform:translate(-50%,8px)}}

/* ---------- HISTORY TABLE ---------- */
.histhead,.histrow{display:grid;grid-template-columns:1.1fr 1.6fr 1fr .7fr 1.2fr;gap:12px;align-items:center}
.histhead{padding:10px 20px;border-bottom:1px solid var(--line);background:var(--sunken);color:var(--muted);font-size:13px;font-weight:600}
.hstat{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.show-sm{display:none}

@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media(max-width:1100px){.dash{grid-template-columns:1fr}.four{grid-template-columns:repeat(2,minmax(0,1fr))}.detail{grid-template-columns:minmax(0,1fr) 280px}}

.top{flex-direction:column;align-items:stretch;margin-bottom:16px}.top h1{font-size:24px}.top>.btn,.topbtns{width:100%}.topbtns .btn{flex:1}

.banner .btn{width:100%}
.hd,.body{padding-left:16px;padding-right:16px}
.row{flex-wrap:wrap;row-gap:8px;padding:12px 16px}.row>.grow{flex:1 1 calc(100% - 90px)}.row>.ic{order:2}.row>.pills{order:3;justify-content:flex-start;width:100%;padding-left:52px}
.prow{padding:14px 16px}
.toolbar{padding:16px 16px 12px;flex-wrap:nowrap}.searchbox{min-width:0}
.filt-toggle{display:inline-flex;flex:none}
.chips{padding:0 16px 12px}
.adv{display:none;padding:0 16px 16px}.adv.open{display:grid;grid-template-columns:1fr 1fr}.adv .field{min-width:0;width:100%}
.rescount{padding:6px 16px}
.facts{grid-template-columns:1fr}
.dhead h1{font-size:22px}
.ctarow .btn{flex:1}
.camera{min-height:280px}

const AICOND={'Tidak Layak Digunakan':100,'Perlu Perbaikan':60,'Perlu Perhatian':30,'Baik':0};const AIINSP={Overdue:25,Due:10,Completed:0};

const aiLevel=s=>s>=115?'Kritis':s>=75?'Tinggi':s>=45?'Sedang':'Rendah';const aiLevelClass=l=>({Kritis:'unsafe',Tinggi:'repair',Sedang:'attention'}[l]||'completed');
const aiAction=c=>c==='Tidak Layak Digunakan'?'Tarik dari layanan, pasang label larangan pakai, dan siapkan unit pengganti pada shift ini.':c==='Perlu Perbaikan'?'Jadwalkan perbaikan komponen oleh teknisi, lalu inspeksi ulang sebelum alat dipakai kembali.':c==='Perlu Perhatian'?'Perbaiki temuan ringan dan pantau kondisi sebelum jadwal inspeksi berikutnya.':'Verifikasi ulang temuan, lalu tutup tindak lanjut bila alat sudah sesuai standar.';
const aiWhy=x=>x[I.inspection]==='Overdue'?'Inspeksi terlambat sejak '+x[I.next]:x[I.inspection]==='Due'?'Inspeksi jatuh tempo '+x[I.next]:'Inspeksi terakhir '+x[I.last];
function aiRow(item,rank){const x=item.a,level=aiLevel(item.s),cls=aiLevelClass(level);return `<button class="prow" onclick="pick('${x[I.id]}')"><span class="rank r-${cls}">${rank}</span><span class="grow"><span class="prow-top"><span class="code">${esc(x[I.code])}</span><span class="pill ${cls}">${icon(level==='Kritis'?'ban':level==='Tinggi'?'wrench':'warn',14)}Prioritas ${level}</span></span><span class="sub">${esc(x[I.name])} · ${esc(x[I.location])} · ${esc(x[I.point])}</span><span class="finding"><b>Temuan:</b> ${esc(x[I.finding])}</span><span class="todo">${icon('right',16)}<span><b>Aksi:</b> ${aiAction(x[I.condition])}<span class="sub">${esc(aiWhy(x))}</span></span></span></span></button>`}

function setF(k,v){flt[k]=v;filter()}
function resetFilter(){flt={...BLANK};draw()}
function toggleAdv(){advOpen=!advOpen;document.querySelector('#adv').classList.toggle('open',advOpen);document.querySelector('#ftoggle').setAttribute('aria-expanded',advOpen)}
function filter(){const root=document.querySelector('#rows');if(!root)return;const q=flt.q.toLowerCase(),quick=(QUICK.find(x=>x[0]===flt.quick)||QUICK[0])[2];const arr=assets.filter(x=>quick(x)&&`${x[I.code]} ${x[I.name]} ${x[I.location]} ${x[I.point]}`.toLowerCase().includes(q)&&(!flt.type||x[I.type]===flt.type)&&(!flt.loc||x[I.location]===flt.loc)&&(!flt.cond||x[I.condition]===flt.cond)&&(!flt.state||x[I.inspection]===flt.state));
document.querySelectorAll('.chip').forEach(c=>{const on=c.dataset.q===flt.quick;c.classList.toggle('on',on);c.setAttribute('aria-pressed',on)});
const adv=['type','loc','cond','state'].filter(k=>flt[k]).length,fc=document.querySelector('#fcount');if(fc)fc.textContent=adv?` (${adv})`:'';
document.querySelector('#rescount').innerHTML=`<span>Menampilkan <b>${arr.length}</b> dari ${assets.length} alat</span>${flt.q||adv||flt.quick!=='all'?'<button class="link" onclick="resetFilter()">Reset filter</button>':''}`;
root.innerHTML=arr.length?arr.map(x=>row(x,`<span class="sub">${esc(x[I.name])} · ${esc(x[I.location])}</span><span class="sub">Inspeksi berikutnya ${esc(x[I.next])}</span>`,`${cond(x[I.condition])}${state(x[I.inspection])}`)).join(''):empty('search','Tidak ada alat yang sesuai','Ubah kata kunci atau reset filter.')}

/* ---------- ASSET DETAIL ---------- */
function detail(a){const mine=history.filter(x=>x.assetId===chosen[I.id]),open=chosen[I.follow]==='Terbuka';a.innerHTML=`<button class="back" onclick="go('assets')">${icon('left',18)}Daftar alat</button><div class="detail"><div class="stack"><section class="panel"><div class="body"><div class="dhead"><div class="grow"><span class="code">${esc(chosen[I.code])}</span><h1>${esc(chosen[I.name])}</h1><span class="metaline">${icon(typeIcon(chosen[I.type]),18)}${esc(chosen[I.type])} · ${icon('pin',16)}${esc(chosen[I.location])} · ${esc(chosen[I.point])}</span></div>${cond(chosen[I.condition])}</div><div class="ctarow"><button class="btn lg" onclick="useAsset()">${icon('camera',20)}Mulai inspeksi alat ini</button></div><div class="facts"><div class="fact"><span class="label">Status inspeksi</span>${state(chosen[I.inspection])}</div><div class="fact"><span class="label">Inspeksi terakhir</span><strong>${esc(chosen[I.last])}</strong><span class="sub">${esc(chosen[I.inspector])}</span></div><div class="fact"><span class="label">Inspeksi berikutnya</span><strong>${esc(chosen[I.next])}</strong></div></div></div></section>
<section class="panel"><div class="hd"><div><h2>${icon('wrench',18)}Temuan &amp; tindak lanjut</h2></div><span class="pill ${open?'repair':'good'}">${icon(open?'clock':'check',14)}${esc(chosen[I.follow])}</span></div><div class="body"><p><b>${esc(chosen[I.finding])}</b></p><span class="sub">${open?'Verifikasi perbaikan sebelum alat digunakan kembali.':'Tidak ada tindakan terbuka pada aset ini.'}</span></div></section>
<section class="panel"><div class="hd"><div><h2>${icon('history',18)}Riwayat inspeksi</h2></div><span class="count">${mine.length}</span></div>${mine.length?mine.slice(0,4).map(x=>`<button class="row click" onclick="openRecord('${x.id}')"><span class="ico t-${condClass(x.condition)}">${icon('check',18)}</span><span class="grow"><span class="rowtitle">${esc(x.date)}</span><span class="sub">${esc(x.inspector)} · ${x.findings||0} temuan</span></span><span class="pills">${cond(x.condition)}</span>${icon('chev',18)}</button>`).join(''):empty('history','Belum ada inspeksi tersimpan','Inspeksi yang disimpan untuk alat ini akan muncul di sini.')}</section></div>
<aside class="panel qrcard"><div class="body"><h2 class="h3" style="margin:0">Label QR alat</h2><p class="sub">Tempel pada alat. Scan dengan kamera HP untuk membuka halaman ini.</p><div class="qr"></div><span class="code">${esc(chosen[I.code])}</span><div class="qr-actions"><button class="btn outline block" onclick="window.print()">${icon('printer',18)}Cetak label</button></div></div></aside></div>`}

/* ---------- INSPECTION FLOW ---------- */
const STEPS=['Scan QR','Foto','Checklist','Review'];
function stepper(n){return `<ol class="stepper" aria-label="Langkah inspeksi ${n} dari 4">${STEPS.map((s,i)=>`<li class="${i+1<n?'done':i+1===n?'now':''}"${i+1===n?' aria-current="step"':''}><span class="sl"><span class="dot">${i+1<n?icon('tick',14):i+1}</span><span class="lbl">${s}</span></span></li>`).join('')}</ol>`}
function assetChip(){return `<div class="assetchip"><span class="ico">${icon(typeIcon(chosen[I.type]),20)}</span><span class="grow"><span class="code">${esc(chosen[I.code])}</span><span class="sub">${esc(chosen[I.name])} · ${esc(chosen[I.location])}</span></span></div>`}
function scan(a){a.innerHTML=`<button class="back" onclick="go('dashboard')">${icon('left',18)}Batalkan inspeksi</button><div class="flowwrap">${stepper(1)}<div class="panel"><div class="hd"><div><h2>Scan QR alat</h2><p>Arahkan kamera ke label QR yang tertempel pada alat.</p></div></div><div class="body"><div class="camera" id="scanbox"><div class="cammsg" id="scanmsg">${icon('qr',44)}<b>Siap memindai</b><span class="sub">Aktifkan kamera untuk memindai label QR.</span></div></div><div class="actions"><button class="btn outline" onclick="openScan()">${icon('camera',18)}Aktifkan kamera</button><button class="btn" onclick="found()">${icon('check',18)}Simulasikan QR terdeteksi</button></div><div class="hint">${icon('info',18)}<span><b>Mode demo.</b> Belum ada QR fisik? Tekan <b>Simulasikan QR terdeteksi</b>, atau <button class="link inline" onclick="go('assets')">pilih alat dari daftar</button>.</span></div><div id="found" aria-live="polite"></div></div></div></div>`;if(scanstream)attachScan()}
async function openScan(){const msg=document.querySelector('#scanmsg');if(msg)msg.innerHTML=`${icon('camera',44)}<b>Menyalakan kamera…</b>`;try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});if(view!=='scan'){s.getTracks().forEach(x=>x.stop());return}scanstream=s;attachScan()}catch{const m=document.querySelector('#scanmsg');if(m)m.innerHTML=`${icon('info',44)}<b>Kamera tidak tersedia</b><span class="sub">Izinkan akses kamera di browser, atau gunakan simulasi QR.</span>`}}
function attachScan(){const box=document.querySelector('#scanbox');if(!box)return;box.innerHTML='<video autoplay playsinline muted></video><div class="frame"></div><span class="framehint">Arahkan QR ke dalam bingkai</span>';const v=box.querySelector('video');v.srcObject=scanstream;v.play().catch(()=>{})}
function found(){stop();const box=document.querySelector('#scanbox');if(box)box.innerHTML=`<div class="cammsg">${icon('check',44)}<b>QR terdeteksi</b><span class="sub">${esc(chosen[I.code])}</span></div>`;const f=document.querySelector('#found');f.innerHTML=`<div class="banner ok" style="margin:16px 0 0">${icon('check',22)}<span class="grow"><b>${esc(chosen[I.code])} · ${esc(chosen[I.name])}</b>${esc(chosen[I.location])} · ${esc(chosen[I.point])}</span></div><button class="btn lg block" style="margin-top:12px" onclick="useAsset()">Lanjut ke foto kondisi${icon('right',18)}</button>`;f.scrollIntoView({block:'nearest'})}
function camera(a){a.innerHTML=`<button class="back" onclick="go('detail')">${icon('left',18)}Detail alat</button><div class="flowwrap">${stepper(2)}<div class="panel"><div class="hd"><div><h2>Foto kondisi alat</h2><p>Foto wajib sebagai bukti inspeksi. Pastikan label dan kondisi alat terlihat jelas.</p></div></div><div class="body">${assetChip()}${photo?`<img class="preview" src="${photo}" alt="Foto kondisi ${esc(chosen[I.code])}"><div class="meta">${icon('camera',16)}Diambil ${esc(captured)}</div><div class="sticky"><button class="btn outline" onclick="redoPhoto()">${icon('camera',18)}Ambil ulang</button><div class="btns"><button class="btn" onclick="go('check')">Lanjut ke checklist${icon('right',18)}</button></div></div>`:`<div class="camera" id="photobox"><div class="cammsg" id="photomsg">${icon('camera',44)}<b>Menyiapkan kamera…</b><span class="sub">Izinkan akses kamera bila diminta browser.</span></div></div><div class="meta">${icon('info',16)}Foto diambil langsung dari kamera, bukan dari galeri.</div><div class="sticky"><div class="btns"><button class="btn lg" id="shutter" onclick="take()" disabled>${icon('camera',20)}Ambil foto</button></div></div>`}</div></div></div>`;if(!photo){if(stream)attachPhoto();else openPhoto()}}
async function openPhoto(){if(camPending)return;camPending=true;const msg=document.querySelector('#photomsg');if(msg)msg.innerHTML=`${icon('camera',44)}<b>Menyalakan kamera…</b><span class="sub">Izinkan akses kamera bila diminta browser.</span>`;try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});if(view!=='photo'||photo){s.getTracks().forEach(x=>x.stop());return}stream=s;attachPhoto()}catch{const m=document.querySelector('#photomsg');if(m)m.innerHTML=`${icon('info',44)}<b>Kamera tidak dapat diakses</b><span class="sub">Izinkan akses kamera di pengaturan browser, lalu coba lagi.</span><button class="btn outline" style="margin-top:14px" onclick="openPhoto()">Coba lagi</button>`}finally{camPending=false}}
function attachPhoto(){const box=document.querySelector('#photobox');if(!box)return;box.innerHTML='<video id="photovid" autoplay playsinline muted></video>';const v=box.querySelector('video'),ready=()=>{const b=document.querySelector('#shutter');if(b)b.disabled=false};v.addEventListener('loadeddata',ready);v.srcObject=stream;v.play().catch(()=>{});if(v.readyState>=2)ready()}
function take(){const v=document.querySelector('#photovid');if(!v||v.readyState<2)return;const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);photo=c.toDataURL('image/jpeg',.85);captured=new Date().toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'});stop();draw()}
function redoPhoto(){photo='';captured='';draw()}
function checklist(a){const done=filled(),condition=done?rule():'';a.innerHTML=`<button class="back" onclick="go('photo')">${icon('left',18)}Kembali ke foto</button><div class="flowwrap">${stepper(3)}<div class="panel"><div class="hd"><div><h2>Checklist ${esc(chosen[I.type])}</h2><p>${esc(chosen[I.code])} · ${esc(chosen[I.name])}</p></div>${condition?cond(condition):'<span class="pill">Belum dinilai</span>'}</div><div class="body"><div class="hint" style="margin-top:0">${icon('info',18)}<span>Pilih jawaban sesuai kondisi aktual. <b>Status alat dihitung otomatis</b> dari jawaban, bukan dari foto.</span></div>${sections().map(section=>`<section class="section"><h3>${esc(section[0])}</h3>${section[1].map(question).join('')}</section>`).join('')}<div class="sticky"><div class="cstat" aria-live="polite"><span id="cdone"></span><div class="minibar"><i id="cbar"></i></div></div><div class="btns"><button class="btn" id="cnext" onclick="go('review')">Review hasil${icon('right',18)}</button></div></div></div></div></div>`;updateFooter()}
function question(x){const value=answers[x[0]],bad=flagged(value),n=items().findIndex(y=>y[0]===x[0])+1;return `<div class="question${bad?' flag':''}${value?' done':''}"><div class="qtop"><span class="qnum">${value?icon('tick',14):n}</span><div class="grow"><b id="ql-${x[0]}">${x[1]}</b><p>${x[2]}</p></div></div><div class="answers" role="group" aria-labelledby="ql-${x[0]}">${x[3].map(o=>`<button type="button" class="answer${value===o?' sel t-'+tone(o):''}" aria-pressed="${value===o}" data-q="${x[0]}" data-o="${esc(o)}" onclick="answer('${x[0]}','${o}')">${value===o?icon(tone(o)==='ok'?'tick':'warn',16):''}${o}</button>`).join('')}</div>${bad?`<label class="notelabel" for="n-${x[0]}">Catatan temuan <i>(wajib)</i></label><textarea id="n-${x[0]}" oninput="note('${x[0]}',this.value)" placeholder="Jelaskan kondisi dan lokasi masalah…">${esc(notes[x[0]]||'')}</textarea>`:''}</div>`}
function answer(k,v){answers[k]=v;if(!flagged(v))delete notes[k];draw();const b=document.querySelector(`[data-q="${k}"][data-o="${CSS.escape(v)}"]`);if(b)b.focus({preventScroll:true})}
function note(k,v){notes[k]=v;updateFooter()}
function updateFooter(){const d=document.querySelector('#cdone');if(!d)return;const done=filled(),total=items().length,miss=missing();d.innerHTML=done<total?`<b>${done} dari ${total}</b> terjawab`:miss?`<b>${miss} catatan temuan</b> belum diisi`:'<b>Lengkap.</b> Siap direview';document.querySelector('#cbar').style.width=done/total*100+'%';document.querySelector('#cnext').disabled=!(done===total&&!miss)}
function answerRows(ans,nts){const known=items().filter(x=>ans[x[0]]!==undefined),list=known.length?known:Object.keys(ans).map(k=>[k,k]);return list.map(x=>{const v=ans[x[0]],t=tone(v);return `<div class="row"><span class="ico t-${TONEROW[t]}">${icon(t==='ok'?'check':'warn',18)}</span><span class="grow"><span class="rowtitle">${esc(x[1])}</span><span class="sub">${esc(v)}</span>${nts&&nts[x[0]]?`<span class="rownote"><b>Catatan:</b> ${esc(nts[x[0]])}</span>`:''}</span></div>`}).join('')}
function review(a){const c=rule(),t=TONEOF[c],flags=items().filter(x=>flagged(answers[x[0]]));a.innerHTML=`<button class="back" onclick="go('check')">${icon('left',18)}Ubah checklist</button><div class="flowwrap wide">${stepper(4)}<div class="panel"><div class="hd"><div><h2>Review sebelum disimpan</h2><p>${esc(chosen[I.code])} · ${esc(chosen[I.name])}</p></div></div><div class="body"><div class="banner ${t}">${icon(TONEICON[t],24)}<span class="grow"><b>Hasil: ${esc(c)}</b>${ADVICE[c]}</span></div><div class="review"><div><h3 class="h3">Foto dokumentasi</h3><img class="preview" src="${photo}" alt="Dokumentasi ${esc(chosen[I.code])}"><div class="meta">${icon('camera',16)}Diambil ${esc(captured)}</div></div><div><h3 class="h3">Jawaban checklist</h3><div class="panel">${answerRows(answers,notes)}</div></div></div><div class="sticky"><span class="cstat">${flags.length?`<b>${flags.length} temuan</b> akan dicatat sebagai tindak lanjut`:'<b>Tidak ada temuan.</b> Semua jawaban aman.'}</span><div class="btns"><button class="btn lg" onclick="this.disabled=true;submit()">${icon('check',20)}Simpan inspeksi</button></div></div></div></div></div>`}
function submit(){view='process';draw();setTimeout(()=>{let condition=rule(),flags=items().filter(x=>flagged(answers[x[0]]));record={id:'in-'+Date.now(),assetId:chosen[I.id],code:chosen[I.code],name:chosen[I.name],date:new Date().toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'}),inspector:'Inspector Demo',condition,findings:flags.length,follow:condition==='Baik'?'Tidak ada':'Terbuka',photo,captured,answers:{...answers},notes:{...notes}};history.unshift(record);localStorage.setItem('safetyops-history',JSON.stringify(history));chosen[I.condition]=condition;chosen[I.inspection]='Completed';chosen[I.last]=record.date;chosen[I.inspector]=record.inspector;chosen[I.finding]=flags.length?flags.map(x=>x[1]).join(', '):'Tidak ada';chosen[I.follow]=record.follow;view='result';draw()},650)}
function process(a){a.innerHTML=`<div class="flowwrap"><div class="panel"><div class="loading" role="status"><div class="spin"></div><h2>Menyimpan inspeksi…</h2><p class="sub">Mengunggah foto dan menyimpan checklist. Jangan tutup halaman ini.</p></div></div></div>`}
function result(a){const c=chosen[I.condition],t=TONEOF[c]||'ok';a.innerHTML=`<div class="flowwrap"><div class="panel"><div class="body"><div class="resulthead"><span class="bigic t-${t}">${icon(TONEICON[t],30)}</span><div class="grow"><span class="label">Inspeksi tersimpan</span><h1>${esc(chosen[I.code])}</h1><span class="sub">${esc(chosen[I.name])} · ${esc(chosen[I.location])}</span><div style="margin-top:10px">${cond(c)}</div></div></div><div class="box"><span class="label">Tindak lanjut</span><h2>${c==='Baik'?'Tidak ada tindakan mendesak':'Perlu tindak lanjut'}</h2><p>${ADVICE[c]}</p><span class="sub">Status tindak lanjut: <b>${esc(chosen[I.follow])}</b></span>${c!=='Baik'&&chosen[I.follow]!=='Selesai'?`<button class="btn outline" style="margin-top:12px" onclick="closeFollowup()">${icon('check',18)}Tandai tindak lanjut selesai</button>`:''}</div><div class="sticky"><button class="btn outline" onclick="go('dashboard')">${icon('home',18)}Dashboard</button><div class="btns"><button class="btn outline" onclick="go('history')">${icon('history',18)}Riwayat</button><button class="btn" onclick="begin()">${icon('scan',18)}Inspeksi berikutnya</button></div></div></div></div></div>`}
function closeFollowup(){chosen[I.follow]='Selesai';if(record)record.follow='Selesai';localStorage.setItem('safetyops-history',JSON.stringify(history));draw()}

/* ---------- HISTORY ---------- */
function histories(a){a.innerHTML=head('Riwayat Inspeksi',`${history.length} catatan inspeksi tersimpan.`)+`<div class="panel"><div class="toolbar"><div class="searchbox">${icon('search',18)}<input class="field search" id="hq" type="search" value="${esc(hflt.q)}" oninput="hflt.q=this.value;filterHistory()" aria-label="Cari riwayat" placeholder="Cari kode alat, nama, atau inspektor" autocomplete="off"></div><select class="field" aria-label="Kondisi" onchange="hflt.cond=this.value;filterHistory()">${opt('','Semua kondisi',hflt.cond)}${CONDS.map(x=>opt(x,x,hflt.cond)).join('')}</select><select class="field" aria-label="Tindak lanjut" onchange="hflt.follow=this.value;filterHistory()">${opt('','Semua tindak lanjut',hflt.follow)}${opt('Terbuka','Terbuka',hflt.follow)}${opt('Selesai','Selesai',hflt.follow)}</select></div><div class="histhead" aria-hidden="true"><span>Tanggal</span><span>Alat</span><span>Inspektor</span><span>Temuan</span><span>Kondisi</span></div><div id="hrows"></div></div>`;filterHistory()}
function filterHistory(){const root=document.querySelector('#hrows');if(!root)return;const q=hflt.q.toLowerCase(),arr=history.filter(x=>`${x.code} ${x.name} ${x.inspector}`.toLowerCase().includes(q)&&(!hflt.cond||x.condition===hflt.cond)&&(!hflt.follow||x.follow===hflt.follow));root.innerHTML=arr.length?arr.map(x=>`<button class="row click histrow" onclick="openRecord('${x.id}')"><span class="hide">${esc(x.date)}</span><span><span class="code">${esc(x.code)}</span><span class="sub">${esc(x.name)}</span><span class="sub show-sm">${esc(x.date)}</span></span><span class="hide">${esc(x.inspector)}</span><span class="hide">${x.findings||0} temuan</span><span class="hstat">${cond(x.condition)}<span class="sub">Tindak lanjut: ${esc(x.follow)}</span></span></button>`).join(''):history.length?empty('search','Tidak ada riwayat yang sesuai','Ubah kata kunci atau filter.'):empty('history','Belum ada riwayat inspeksi','Selesaikan satu inspeksi untuk melihat catatannya di sini.')}
function openRecord(id){record=history.find(x=>String(x.id)===String(id));if(record){const asset=assets.find(x=>x[I.id]===record.assetId);if(asset)chosen=asset}view='historyDetail';draw()}
function historyDetail(a){if(!record)return go('history');const hasAsset=assets.some(x=>x[I.id]===record.assetId);a.innerHTML=`<button class="back" onclick="go('history')">${icon('left',18)}Riwayat inspeksi</button><div class="flowwrap wide"><div class="panel"><div class="hd"><div><h2>${esc(record.code)} · ${esc(record.name)}</h2><p>${esc(record.date)} · ${esc(record.inspector)}</p></div>${cond(record.condition)}</div><div class="body"><div class="review"><div><h3 class="h3">Bukti foto</h3>${record.photo?`<img class="preview" src="${record.photo}" alt="Bukti foto ${esc(record.code)}"><div class="meta">${icon('camera',16)}Diambil ${esc(record.captured||record.date)}</div>`:'<p class="sub">Foto tidak tersedia pada catatan ini.</p>'}</div><div><h3 class="h3">Jawaban checklist</h3><div class="panel">${Object.keys(record.answers||{}).length?answerRows(record.answers,record.notes):'<div class="empty">Data checklist tidak tersedia untuk catatan ini.</div>'}</div><p class="sub" style="margin-top:12px">Tindak lanjut: <b>${esc(record.follow)}</b></p></div></div>${hasAsset?`<div class="actions"><button class="btn outline" onclick="pick('${record.assetId}')">Lihat detail alat${icon('right',18)}</button></div>`:''}</div></div></div>`}

/* ---------- RECAP ---------- */
function recap(a){const n=c=>assets.filter(x=>x[I.condition]===c).length,openList=assets.filter(x=>x[I.follow]==='Terbuka'),byLoc={};assets.forEach(x=>{const k=x[I.location];byLoc[k]=byLoc[k]||{t:0,bad:0};byLoc[k].t++;if(x[I.condition]!=='Baik')byLoc[k].bad++});const locs=Object.keys(byLoc).sort((p,q)=>byLoc[q].bad-byLoc[p].bad||byLoc[q].t-byLoc[p].t).slice(0,8);
a.innerHTML=head('Rekap Inspeksi','Ringkasan kondisi dan tindak lanjut untuk laporan.',`<button class="btn outline" onclick="window.print()">${icon('printer',18)}Cetak rekap</button>`)+`<div class="grid four">${kpi('info','history','Inspeksi tersimpan',history.length,'Tercatat di sistem',"go('history')")}${kpi('fix','wrench','Tindak lanjut terbuka',openList.length,'Temuan belum selesai',"goAssets('open')")}${kpi('bad','ban','Tidak layak digunakan',n('Tidak Layak Digunakan'),'Prioritas tertinggi',"goAssets('unsafe')")}${kpi('ok','check','Kondisi baik',n('Baik'),'Tetap inspeksi rutin',"goCond('Baik')")}</div>
<div class="dash"><section class="panel"><div class="hd"><div><h2>${icon('wrench',18)}Tindak lanjut terbuka</h2><p>Selesaikan sebelum jadwal inspeksi berikutnya</p></div><span class="count">${openList.length}</span></div>${openList.map(x=>row(x,`<span class="sub">${esc(x[I.finding])}</span><span class="sub">${esc(x[I.location])}</span>`,`${cond(x[I.condition])}${state(x[I.inspection])}`)).join('')||empty('check','Tidak ada tindak lanjut terbuka','Seluruh temuan sudah ditutup.')}</section>
<div class="stack">${distPanel()}<section class="panel"><div class="hd"><div><h2>${icon('pin',18)}Lokasi perlu perhatian</h2><p>Jumlah alat yang tidak berkondisi baik per lokasi</p></div></div><div class="body">${locs.map(k=>`<div class="locrow"><div class="dist"><span>${esc(k)}</span><b>${byLoc[k].bad} dari ${byLoc[k].t}</b></div><div class="bar" aria-hidden="true"><i style="width:${byLoc[k].bad/byLoc[k].t*100}%;background:${byLoc[k].bad?'var(--fix)':'var(--ok)'}"></i></div></div>`).join('')}</div></section></div></div>`}

function paintIcons(){document.querySelectorAll('[data-icon]').forEach(el=>{if(el.dataset.painted)return;el.dataset.painted='1';el.insertAdjacentHTML('afterbegin',icon(el.dataset.icon,Number(el.dataset.isz||20)))})}
{const h=location.hash.slice(1);if(['assets','history','recap'].includes(h))view=h}
// Tahan render sampai supabase-client.js memuat data asli, supaya 40 aset contoh
// tidak sempat tampil lalu tertimpa data Supabase beberapa detik kemudian.
let booting=true,bootError=false;
function bootScreen(a){const h=head('Dashboard',`${today()} · Ringkasan kondisi alat K3`);a.innerHTML=bootError?h+`<section class="panel">${empty('warn','Data belum dapat dimuat','Periksa koneksi internet, lalu coba lagi.')}<div class="body" style="padding-top:0;text-align:center"><button class="btn" onclick="location.reload()">Coba lagi</button></div></section>`:h+`<div class="bootmsg" role="status"><span class="spin"></span>Memuat data alat dari server…</div><div class="grid four">${'<span class="skel sk-kpi"></span>'.repeat(4)}</div><div class="dash"><span class="skel sk-card"></span><span class="skel sk-card"></span></div>`}
function finishBoot(){booting=false;bootError=false;draw()}
paintIcons();draw();
// Tanpa supabase-client.js (mis. CDN gagal dimuat), tampilkan mode demo offline.
window.addEventListener('load',()=>{if(typeof bootstrapSupabase!=='function')finishBoot()});
