<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SafetyOps Inspect</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{
--navy:#08172c;--navy-2:#0f2747;--navy-3:#16355e;--brand:#0b2f6b;--brand-hi:#123e88;
--accent:#ffc21a;--accent-hi:#ffd257;--accent-ink:#1a1204;
--bg:#eef1f5;--p:#fff;--i:#0d1521;--m:#5d6b7f;--l:#dde2e9;--l2:#eef1f5;
--g:#14833b;--gs:#14833b;--a:#b45309;--as:#b45309;--o:#c2410c;--os:#c2410c;--r:#b91c1c;--rs:#b91c1c;
--due:#1d4ed8;--dues:#1d4ed8;--slate:#475569;--ai:#6d28d9;--ai-bg:#f6f2ff;--ai-bd:#ddd0fb;
--gbg:#e8f5ec;--abg:#fdf3e3;--obg:#fdeade;--rbg:#fceaea;--duebg:#e9effd;
--sp1:8px;--sp2:12px;--sp3:16px;--sp4:24px;--sp5:32px;
--sd:254px;--rad:8px;--rad-s:6px;
--sans:'IBM Plex Sans',"Segoe UI",Arial,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
--sh:0 1px 2px #0d152112,0 1px 3px #0d15210a;--sh2:0 4px 16px #0d152114;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--i);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
.ic{flex:none;vertical-align:-.18em}

/* ---------- SHELL + SIDEBAR ---------- */
.shell{min-height:100vh;padding-left:var(--sd)}
.side{position:fixed;inset:0 auto 0 0;width:var(--sd);background:var(--navy);color:#b9c6d8;padding:20px 12px;display:flex;flex-direction:column;overflow-y:auto}
.side:after{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--accent)}
.brand{display:flex;gap:10px;align-items:center;color:#fff;font-weight:700;font-size:15.5px;letter-spacing:-.01em;padding:4px 6px}
.logo{display:grid;place-items:center;width:34px;height:34px;flex:none;border-radius:var(--rad-s);background:var(--accent);color:var(--accent-ink)}
.subside{font-size:11.5px;color:#7f8ca1;padding:8px 6px 0;line-height:1.65}
.subside b{color:var(--accent);font-weight:600}
.signout{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:#8e9bb0;padding:9px 0 0;font:inherit;font-size:11.5px;cursor:pointer}
.signout:hover{color:#fff}
.navtitle{font-size:10px;font-weight:700;letter-spacing:.11em;color:#65738a;margin:26px 8px 8px;text-transform:uppercase}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;border-radius:var(--rad-s);background:transparent;color:#aebbcd;padding:11px 12px;text-align:left;font:inherit;font-weight:600;font-size:14px;margin:2px 0;cursor:pointer;min-height:44px;position:relative;transition:background .18s,color .18s}
.nav button:hover{background:var(--navy-2);color:#fff}
.nav button.on{background:var(--brand);color:#fff}
.nav button.on:before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}

/* ---------- PAGE HEAD ---------- */
.main{max-width:1400px;margin:auto;padding:26px 28px 56px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:var(--sp4)}
.top h1{font-size:27px;letter-spacing:-.025em;margin:0;font-weight:700}
.top p{margin:5px 0 0;color:var(--m);font-size:13.5px}
button,input,select,textarea{font:inherit}

/* ---------- BUTTONS ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--accent);border-radius:var(--rad-s);padding:10px 18px;min-height:46px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;cursor:pointer;transition:background .18s,border-color .18s,transform .12s}
.btn:hover{background:var(--accent-hi);border-color:var(--accent-hi)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}
.outline{background:#fff;color:var(--i);border-color:#c6cede}
.outline:hover{background:#f5f7fa;border-color:#aab6c9}
.btn.navy{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.navy:hover{background:var(--brand-hi);border-color:var(--brand-hi)}
.btn:focus-visible,.nav button:focus-visible,.field:focus-visible,.answer:focus-visible,.row:focus-visible,.signout:focus-visible{outline:3px solid var(--due);outline-offset:2px}

/* ---------- GRID + PANELS ---------- */
.grid{display:grid;gap:var(--sp3)}
.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.dash{display:grid;grid-template-columns:minmax(0,1.32fr) minmax(0,1fr);gap:var(--sp3);margin-top:var(--sp3);align-items:start}
.stack{display:grid;gap:var(--sp3)}
.panel{background:var(--p);border:1px solid var(--l);border-radius:var(--rad);box-shadow:var(--sh);overflow:hidden}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--l)}
.hd h2{margin:0;font-size:16px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.hd p{margin:3px 0 0;color:var(--m);font-size:12px}
.body{padding:18px}
.count{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--m);background:var(--l2);border:1px solid var(--l);border-radius:20px;padding:3px 10px;white-space:nowrap}

/* ---------- KPI METRICS (solid colour chips) ---------- */
.metric{display:flex;gap:14px;align-items:flex-start;padding:18px;border-left:4px solid var(--slate)}
.metric .mi{display:grid;place-items:center;width:42px;height:42px;flex:none;border-radius:var(--rad-s);background:var(--slate);color:#fff}
.metric.k1{border-left-color:var(--brand)}.metric.k1 .mi{background:var(--brand)}
.metric.k2{border-left-color:var(--due)}.metric.k2 .mi{background:var(--due)}
.metric.k3{border-left-color:var(--o)}.metric.k3 .mi{background:var(--o)}
.metric.k4{border-left-color:var(--r)}.metric.k4 .mi{background:var(--r)}
.metric.k5{border-left-color:var(--g)}.metric.k5 .mi{background:var(--g)}
.metric label{color:var(--m);font-size:12px;font-weight:600}
.metric strong{display:block;font-family:var(--mono);font-size:30px;line-height:1.05;margin:7px 0 4px;letter-spacing:-.02em}
.metric span,.sub{display:block;color:var(--m);font-size:12px}

/* ---------- NOTICE ---------- */
.notice{display:flex;gap:10px;align-items:center;border:1px solid #c9d8f6;border-left:4px solid var(--due);background:var(--duebg);color:#16337a;padding:11px 14px;border-radius:var(--rad-s);font-size:12.5px;margin-bottom:var(--sp3)}
.notice b{font-weight:700}

/* ---------- LIST ROWS ---------- */
.row{display:flex;gap:12px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--l2);background:#fff;padding:13px 18px;text-align:left;min-height:56px;transition:background .15s}
.click{cursor:pointer}
.click:hover{background:#f6f8fb}
.row:last-child{border-bottom:0}
.grow{flex:1;min-width:0}
.ico{display:grid;place-items:center;width:38px;height:38px;flex:none;border-radius:var(--rad-s);background:var(--l2);border:1px solid var(--l);color:var(--brand)}
.ico.t-good{background:var(--gbg);border-color:#bfe1ca;color:var(--g)}
.ico.t-attention{background:var(--abg);border-color:#f0d6a6;color:var(--a)}
.ico.t-repair{background:var(--obg);border-color:#f5c4a2;color:var(--o)}
.ico.t-unsafe{background:var(--rbg);border-color:#f0bcbc;color:var(--r)}
.code{display:block;font-family:var(--mono);font-weight:600;font-size:13px;letter-spacing:.01em}

/* ---------- STATUS PILLS (solid) ---------- */
.pill{display:inline-flex;gap:5px;align-items:center;white-space:nowrap;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.01em;color:#fff;background:var(--slate)}
.good{background:var(--gs)}
.attention{background:var(--as)}
.repair{background:var(--os)}
.unsafe{background:var(--rs)}
.due{background:var(--dues)}
.overdue{background:var(--rs)}
.completed{background:var(--slate)}
.pill.soft{color:var(--i);background:var(--l2);border:1px solid var(--l)}
.pills{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

/* ---------- AI PANEL ---------- */
.ai .hd{background:var(--ai-bg);border-bottom-color:var(--ai-bd)}
.ai .hd h2{color:var(--ai)}
.ai{border-color:var(--ai-bd)}
.aibadge{display:inline-flex;align-items:center;gap:5px;background:var(--ai);color:#fff;border-radius:20px;padding:4px 10px;font-size:10.5px;font-weight:700;letter-spacing:.04em}
.airow{display:flex;gap:12px;padding:14px 18px;border-bottom:1px solid var(--l2);width:100%;background:#fff;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;align-items:flex-start;transition:background .15s}
.airow:last-of-type{border-bottom:0}
.airow:hover{background:#faf8ff}
.rank{display:grid;place-items:center;width:26px;height:26px;flex:none;border-radius:6px;background:var(--ai);color:#fff;font-family:var(--mono);font-size:12px;font-weight:700}
.rank.p2{background:#8b5cf6}.rank.p3{background:#a78bfa}.rank.p4{background:#c4b5fd;color:#3b1d86}
.aiact{display:block;margin-top:6px;font-size:12px;color:var(--i);background:var(--ai-bg);border-left:3px solid var(--ai-bd);border-radius:0 4px 4px 0;padding:7px 10px}
.aifoot{display:flex;gap:8px;align-items:flex-start;padding:12px 18px;background:#fbfaff;border-top:1px solid var(--ai-bd);color:var(--m);font-size:11.5px;line-height:1.55}

/* ---------- DISTRIBUTION BARS ---------- */
.dist{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:7px}
.dist b{font-family:var(--mono);font-size:13px}
.bar{height:10px;border-radius:20px;background:var(--l2);margin:0 0 16px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:20px;transition:width .4s ease}
.bar:last-child{margin-bottom:0}
.stackbar{display:flex;height:14px;border-radius:20px;overflow:hidden;background:var(--l2);margin:2px 0 14px}
.stackbar i{display:block;height:100%}

/* ---------- TOOLBAR + FIELDS ---------- */
.toolbar{display:flex;gap:9px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--l);background:#fbfcfd}
.field{height:44px;border:1px solid #c6cede;border-radius:var(--rad-s);padding:0 12px;background:#fff;color:var(--i);min-width:150px;font-size:13.5px}
.field:hover{border-color:#aab6c9}
.search{flex:1;min-width:220px}

/* ---------- DETAIL ---------- */
.detail{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--sp3)}
.dhead{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.dhead h1{font-size:24px;letter-spacing:-.02em;margin:4px 0}
.facts{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--l);background:#fafbfc;border-radius:var(--rad-s);margin-top:20px;overflow:hidden}
.fact{padding:13px 15px;border-right:1px solid var(--l)}
.fact:last-child{border-right:0}
.fact label{display:block;color:var(--m);font-size:11px;font-weight:600;margin-bottom:5px}
.fact strong{display:block;font-size:13px}
.back{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;color:var(--m);font:inherit;font-size:13px;font-weight:600;padding:0;margin:0 0 14px;cursor:pointer;min-height:32px}
.back:hover{color:var(--brand)}
.qr{width:156px;height:156px;margin:16px auto;display:grid;place-items:center;background:#fff;border:1px solid var(--l);border-radius:var(--rad-s);padding:8px}

/* ---------- INSPECTION FLOW ---------- */
.progress{height:6px;background:var(--l2);border-radius:20px;overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:20px;transition:width .35s ease}
.camera{min-height:300px;background:#0a121e;border:1px solid var(--navy-3);border-radius:var(--rad-s);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;color:#dbe2ec;text-align:center}
.camera video{width:100%;height:100%;min-height:300px;object-fit:cover}
.cammsg{padding:20px;max-width:360px}
.frame{position:absolute;width:64%;height:52%;border:3px solid var(--accent);border-radius:var(--rad-s)}
.frame:after{content:"Arahkan QR alat ke dalam bingkai";position:absolute;top:calc(100% + 14px);left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--navy);padding:6px 10px;border-radius:20px;font-size:12px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.preview{width:100%;max-height:340px;object-fit:cover;border:1px solid var(--l);border-radius:var(--rad-s);background:var(--l2)}
.meta{display:flex;gap:7px;align-items:center;color:var(--m);font-size:12px;margin-top:9px}
.hint{display:flex;gap:10px;align-items:flex-start;margin:16px 0;padding:12px 14px;border-left:4px solid var(--accent);background:#fff8e3;color:#5c4708;font-size:12.5px;border-radius:0 var(--rad-s) var(--rad-s) 0}
.section{border-bottom:1px solid var(--l2);padding:18px 0}
.section h3{font-size:14px;margin:0 0 2px}
.section>p{font-size:12px;color:var(--m);margin:0 0 10px}
.question{padding:14px 0;border-top:1px solid var(--l2)}
.question.flag{background:var(--abg);margin:0 -12px;padding:14px 12px;border-left:3px solid var(--a);border-radius:0 var(--rad-s) var(--rad-s) 0}
.qtop{display:flex;gap:10px}
.qnum{color:var(--m);font-size:12px;font-weight:700;min-width:18px;font-family:var(--mono)}
.question b{font-size:13.5px}
.question p{margin:2px 0 0;color:var(--m);font-size:12px}
.answers{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0 28px}
.answer{min-height:44px;background:#fff;border:1px solid #c6cede;border-radius:var(--rad-s);padding:8px 14px;color:var(--i);cursor:pointer;font-size:12.5px;font-weight:600;transition:background .15s,border-color .15s}
.answer:hover{border-color:#8fa0bb;background:#f7f9fc}
.answer.sel{background:var(--brand);border-color:var(--brand);color:#fff}
.question textarea{width:calc(100% - 28px);margin:10px 0 0 28px;min-height:76px;border:1px solid #f0d6a6;border-radius:var(--rad-s);padding:10px;font-size:12.5px;background:#fff}
.sticky{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--l);padding-top:18px;margin-top:18px}
.review{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:var(--sp3)}
.empty{padding:40px 20px;text-align:center;color:var(--m);font-size:13px}
.empty strong{display:block;color:var(--i);font-size:15px;margin-bottom:6px}
.empty .ec{display:grid;place-items:center;width:48px;height:48px;margin:0 auto 14px;border-radius:50%;background:var(--l2);color:var(--m)}

/* ---------- HISTORY TABLE ---------- */
.histhead,.histrow{display:grid;grid-template-columns:1.1fr 1.5fr 1fr .8fr 1fr;gap:12px;align-items:center}
.histhead{padding:11px 18px;background:#fafbfc;color:#6a7889;font-size:10px;font-weight:700;letter-spacing:.07em;border-bottom:1px solid var(--l)}

/* ---------- MOBILE NAV ---------- */
.mobile{display:none}
.loading{text-align:center;padding:52px 12px}
.spin{width:34px;height:34px;border:3px solid var(--l2);border-top-color:var(--accent);border-radius:50%;margin:0 auto 14px;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

@media(max-width:1100px){.dash{grid-template-columns:1fr}.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){
.shell{padding-left:0}.side{display:none}.main{padding:16px 14px 84px}
.top{align-items:stretch;flex-direction:column;margin-bottom:16px}.top h1{font-size:22px}.top .btn{width:100%}
.two,.four,.detail,.review,.dash{grid-template-columns:1fr}.grid{gap:12px}
.facts{grid-template-columns:1fr}.fact{border-right:0;border-bottom:1px solid var(--l)}.fact:last-child{border-bottom:0}
.field,.search{width:100%;min-width:0}.camera,.camera video{min-height:265px}
.actions{flex-direction:column}.actions .btn{width:100%}
.sticky{position:sticky;bottom:58px;background:#fff;padding:12px 0;z-index:3}
.histhead{display:none}.histrow{grid-template-columns:1fr auto;gap:6px}.histrow .hide{display:none}
.row{flex-wrap:wrap;row-gap:9px}.row>.grow{flex:1 1 calc(100% - 50px)}.row>.pills{margin-left:50px;justify-content:flex-start;width:100%}
.mobile{display:flex;position:fixed;z-index:4;bottom:0;left:0;right:0;background:var(--navy);border-top:3px solid var(--accent);justify-content:space-around;padding:6px 4px;box-shadow:0 -2px 12px #08172c40}
.mobile button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;color:#9aa8bd;font:inherit;font-size:10.5px;font-weight:600;min-width:64px;padding:6px 3px;min-height:50px;cursor:pointer}
.mobile button.on{color:var(--accent)}
}
@media print{.side,.mobile,.btn,.back,.toolbar{display:none!important}.shell{padding-left:0}.panel{box-shadow:none;break-inside:avoid}}
.resulthead{padding:18px;border-left:4px solid var(--accent);background:#fff8e3;border-radius:0 var(--rad-s) var(--rad-s) 0}
.resulthead h1{font-size:23px;letter-spacing:-.02em}
</style></head><body><div class="shell"><aside class="side"><div class="brand"><span class="logo" data-icon="shield"></span>SafetyOps Inspect</div><div class="subside">Sistem Inspeksi Alat K3</div><div class="navtitle">Navigasi Utama</div><nav class="nav" id="nav"><button onclick="go('dashboard')" data-icon="grid">Dashboard</button><button onclick="go('assets')" data-icon="list">Daftar Alat</button><button onclick="go('history')" data-icon="history">Riwayat</button><button onclick="go('recap')" data-icon="chart">Rekap</button></nav></aside><main class="main" id="app"></main><nav class="mobile" id="mnav"><button onclick="go('dashboard')" data-icon="grid" data-isz="19">Dashboard</button><button onclick="go('assets')" data-icon="list" data-isz="19">Alat</button><button onclick="go('history')" data-icon="history" data-isz="19">Riwayat</button><button onclick="go('recap')" data-icon="chart" data-isz="19">Rekap</button></nav></div><script>
const ICONS={
grid:'<rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/>',
list:'<path d="M8.5 6h12M8.5 12h12M8.5 18h12"/><circle cx="4" cy="6" r="1.3"/><circle cx="4" cy="12" r="1.3"/><circle cx="4" cy="18" r="1.3"/>',
history:'<path d="M3.5 11.2a8.8 8.8 0 1 1 1.2 5.3"/><path d="M3 20.2v-5h5"/><path d="M12 7.6V12l3.4 2"/>',
chart:'<path d="M3.2 20.8h17.6"/><rect x="5" y="12" width="3.8" height="5.6" rx="1.2"/><rect x="10.1" y="7.6" width="3.8" height="10" rx="1.2"/><rect x="15.2" y="3.6" width="3.8" height="14" rx="1.2"/>',
check:'<circle cx="12" cy="12" r="8.8"/><path d="M8.2 12.3l2.6 2.6 5-5.3"/>',
warn:'<path d="M10.3 4.2 2.6 17.6a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.2a2 2 0 0 0-3.4 0Z"/><path d="M12 9.6v4.2"/><circle cx="12" cy="17.2" r=".95" fill="currentColor" stroke="none"/>',
wrench:'<path d="M20.4 5.4a4.7 4.7 0 0 1-6.1 6.1L6.2 19.6a2.05 2.05 0 1 1-2.9-2.9l8.1-8.1a4.7 4.7 0 0 1 6.1-6.1l-3.1 3.1 3 3 3-3.2Z"/>',
ban:'<circle cx="12" cy="12" r="8.8"/><path d="M5.8 5.8l12.4 12.4"/>',
clock:'<circle cx="12" cy="12" r="8.8"/><path d="M12 7v5.3l3.5 2"/>',

function scan(a){a.innerHTML=`<button class="back" onclick="go('dashboard')">${icon('left',16)}Batalkan inspeksi</button><div class="panel" style="max-width:680px;margin:auto"><div class="hd"><h2>Scan QR alat</h2><p>Langkah 1 dari 4 · Arahkan kamera ke label QR aset.</p><div class="progress"><i style="width:25%"></i></div></div><div class="body"><div class="camera" id="scanbox"><div class="cammsg" id="scanmsg"><b>Siap memindai QR</b><br><span class="sub">Izinkan kamera untuk memindai label aset.</span></div></div><div class="hint">${icon('info',17)}<span><b>Mode demo:</b> bila QR fisik belum tersedia, gunakan simulasi agar alur dapat diuji.</span></div><div class="actions"><button class="btn outline" onclick="openScan()">Aktifkan kamera</button><button class="btn" onclick="found()">Simulasikan QR terdeteksi</button></div><div id="found"></div></div></div>`}async function openScan(){let box=document.querySelector('#scanbox'),msg=document.querySelector('#scanmsg');try{msg.textContent='Menyalakan kamera…';scanstream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});box.innerHTML='<video id="scanvid" autoplay playsinline></video><div class="frame"></div>';let v=document.querySelector('#scanvid');v.srcObject=scanstream;await v.play()}catch{msg.innerHTML='<b>Kamera tidak tersedia</b><br><span class="sub">Izinkan kamera pada browser atau gunakan mode demo QR.</span>'}}function found(){stop();document.querySelector('#found').innerHTML=`<div class="notice" style="margin-top:16px">${icon('check',17)}<span><b>QR terdeteksi</b><br>${esc(chosen[I.code])} · ${esc(chosen[I.name])} · ${esc(chosen[I.location])}</span></div><button class="btn" style="width:100%" onclick="useAsset()">Konfirmasi & Mulai Inspeksi</button>`}
function camera(a){a.innerHTML=`<button class="back" onclick="go('scan')">${icon('left',16)}Kembali ke scan QR</button><div class="panel" style="max-width:680px;margin:auto"><div class="hd"><h2>Dokumentasi kondisi</h2><p>Aset ${esc(chosen[I.code])} · Langkah 2 dari 4</p><div class="progress"><i style="width:50%"></i></div></div><div class="body"><h2 style="font-size:17px;margin:0">Ambil foto aktual alat</h2><p class="sub">Pastikan label aset dan kondisi alat terlihat jelas. Foto hanya diambil dari kamera perangkat.</p>${photo?`<img class="preview" src="${photo}" alt="Foto kondisi ${esc(chosen[I.code])}"><div class="meta">${icon('camera',14)}Diambil ${esc(captured)}</div><div class="actions"><button class="btn outline" onclick="redoPhoto()">Ambil ulang</button><button class="btn" onclick="go('check')">Gunakan foto</button></div>`:`<div class="camera" style="margin-top:14px" id="photobox"><div class="cammsg" id="photomsg"><b>Kamera belum aktif</b><br><span class="sub">Aktifkan kamera belakang untuk mendokumentasikan kondisi alat.</span></div></div><div class="actions"><button class="btn outline" onclick="openPhoto()">Aktifkan kamera</button><button class="btn" onclick="take()">Ambil foto</button></div>`}</div></div>`}async function openPhoto(){let box=document.querySelector('#photobox'),msg=document.querySelector('#photomsg');try{msg.textContent='Menyalakan kamera…';stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});box.innerHTML='<video id="photovid" autoplay playsinline></video>';let v=document.querySelector('#photovid');v.srcObject=stream;await v.play()}catch{msg.innerHTML='<b>Kamera tidak dapat diakses</b><br><span class="sub">Izinkan kamera pada browser lalu coba lagi.</span>'}}function take(){let v=document.querySelector('#photovid'),msg=document.querySelector('#photomsg');if(!v||v.readyState<2){if(msg)msg.textContent='Aktifkan kamera dan tunggu preview tampil sebelum mengambil foto.';return}let c=document.cr function checklist(a){let done=filled(),total=items().length,condition=done?rule():'';a.innerHTML=`<button class="back" onclick="go('photo')">${icon('left',16)}Kembali ke foto</button><div class="panel" style="max-width:820px;margin:auto"><div class="hd"><div class="dhead"><div><h2>Checklist kondisi APAR</h2><p>Aset ${esc(chosen[I.code])} · Langkah 3 dari 4 · ${done}/${total} pemeriksaan selesai</p></div>${condition?cond(condition):'<span class="sub">Belum dinilai</span>'}</div><div class="progress"><i style="width:75%"></i></div></div><div class="body"><div class="hint">${icon('info',17)}<span><b>Isi sesuai kondisi aktual.</b> Status akhir dihitung dari checklist, bukan dari foto.</span></div>${checks.map(section=>`<section class="section"><h3>${section[0]}</h3><p>Lengkapi setiap pemeriksaan pada bagian ini.</p>${section[1].map(question).join('')}</section>`).join('')}<div class="sticky"><button class="btn outline" onclick="go('photo')">← Sebelumnya</button><button class="btn" ${done===total&&noteOK()?'':'disabled'} onclick="go('review')">Review hasil →</button></div></div></div>`}function question(x){let value=answers[x[0]],bad=flagged(value),n=items().findIndex(y=>y[0]===x[0])+1;return `<div class="question ${bad?'flag':''}"><div class="qtop"><span class="qnum">${n}</span><div class="grow"><b>${x[1]}</b><p>${x[2]}</p></div></div><div class="answers">${x[3].map(o=>`<button class="answer ${value===o?'sel':''}" onclick="answer('${x[0]}','${o}')">${o}</button>`).join('')}</div>${bad?`<textarea aria-label="Catatan temuan ${x[1]}" oninput="note('${x[0]}',this.value)" placeholder="Catatan temuan wajib…">${esc(notes[x[0]]||'')}</textarea>`:''}</div>`}function answer(k,v){answers[k]=v;if(!flagged(v))delete notes[k];draw()}function note(k,v){notes[k]=v}

function histories(a){a.innerHTML=head('Riwayat Inspeksi','Catatan inspeksi yang telah disimpan.')+`<div class="panel"><div class="toolbar"><input class="field search" id="hq" oninput="filterHistory()" aria-label="Cari riwayat" placeholder="Cari alat atau inspector"><select class="field" id="hc" onchange="filterHistory()"><option value="">Semua kondisi</option>${['Baik','Perlu Perhatian','Perlu Perbaikan','Tidak Layak Digunakan'].map(x=>`<option>${x}</option>`).join('')}</select><select class="field" id="hf" onchange="filterHistory()"><option value="">Semua tindak lanjut</option><option>Terbuka</option><option>Selesai</option></select></div><div class="histhead"><span>TANGGAL</span><span>ALAT</span><span>INSPEKTOR</span><span>TEMUAN</span><span>STATUS</span></div><div id="hrows"></div></div>`;filterHistory()}function filterHistory(){let root=document.querySelector('#hrows');if(!root)return;let q=(document.querySelector('#hq').value||'').toLowerCase(),c=document.querySelector('#hc').value,f=document.querySelector('#hf').value,arr=history.filter(x=>`${x.code} ${x.name} ${x.inspector}`.toLowerCase().includes(q)&&(!c||x.condition===c)&&(!f||x.follow===f));root.innerHTML=arr.length?arr.map(x=>`<button class="row click histrow" onclick="openRecord('${x.id}')"><span class="hide">${esc(x.date)}</span><span><span class="code">${esc(x.code)}</span><span class="sub">${esc(x.name)}</span></span><span class="hide">${esc(x.inspector)}</span><span class="hide">${x.findings} temuan</span><span>${cond(x.condition)}<span class="sub">${esc(x.follow)}</span></span></button>`).join(''):`<div class="empty"><span class="ec">${icon('history',24)}</span><strong>Belum ada riwayat inspeksi</strong>Selesaikan satu inspeksi untuk melihat catatannya di sini.</div>`}function openRecord(id){record=history.find(x=>x.id===id);view='historyDetail';draw()}function historyDetail(a){if(!record)return go('history');a.innerHTML=`<button class="back" onclick="go('history')">${icon('left',16)}Kembali ke riwayat</button><div class="panel" style="max-width:920px;margin:auto"><div class="hd"><div class="dhead"><div><h2>${esc(record.code)} · Detail inspeksi</h2><p>${esc(record.date)} · ${esc(record.inspector)}</p></div>${cond(record.condition)}</div></div><div class="body"><div class="review"><div><h3 style="margin-top:0">Bukti foto</h3>${record.photo?`<img class="preview" src="${record.photo}" alt="Bukti foto ${esc(record.code)}"><div class="meta">${icon('camera',14)}Diambil ${esc(record.captured||record.date)}</div>`:'<p class="sub">Foto tidak tersedia pada catatan lama.</p>'}</div><div><h3 style="margin-top:0">Jawaban checklist</h3><div class="panel">${Object.keys(record.answers||{}).length?items().map(x=>`<div class="row"><span class="ico ${flagged(record.answers[x[0]])?'t-attention':'t-good'}">${icon(flagged(record.answers[x[0]])?'warn':'check',18)}</span><span class="grow"><span class="code">${x[1]}</span><span class="sub">${esc(record.answers[x[0]])}</span></span></div>`).join(''):'<div class="empty">Data checklist tidak tersedia untuk catatan lama.</div>'}</div></div></div></div></div>`}
function recap(a){const n=c=>assets.filter(x=>x[I.condition]===c).length,open=assets.filter(x=>x[I.follow]==='Terbuka').length,total=assets.length||1;const conds=['Baik','Perlu Perhatian','Perlu Perbaikan','Tidak Layak Digunakan'];const byLoc={};assets.forEach(x=>{const k=x[I.location];byLoc[k]=byLoc[k]||{t:0,bad:0};byLoc[k].t++;if(x[I.condition]!=='Baik')byLoc[k].bad++});const locs=Object.keys(byLoc).sort((p,q)=>byLoc[q].bad-byLoc[p].bad||byLoc[q].t-byLoc[p].t).slice(0,8);
a.innerHTML=head('Rekap Inspeksi','Ringkasan untuk keputusan dan tindak lanjut.',`<button class="btn outline" onclick="window.print()">${icon('printer',18)}Cetak rekap</button>`)+`<div class="grid four">${[['k1','history','Inspeksi tersimpan',history.length,'Data perangkat ini'],['k3','wrench','Perlu tindak lanjut',open,'Temuan terbuka'],['k4','ban','Tidak layak digunakan',n('Tidak Layak Digunakan'),'Prioritas tinggi'],['k5','check','Alat kondisi baik',n('Baik'),'Tetap inspeksi rutin']].map(x=>`<div class="panel metric ${x[0]}"><span class="mi">${icon(x[1],22)}</span><span class="grow"><label>${x[2]}</label><strong>${x[3]}</strong><span>${x[4]}</span></span></div>`).join('')}</div>
<div class="dash"><section class="panel"><div class="hd"><div><h2>${icon('wrench',17)}Tindak lanjut terbuka</h2><p>Fokus penyelesaian sebelum jadwal berikutnya</p></div><span class="count">${open}</span></div>${assets.filter(x=>x[I.follow]==='Terbuka').map(x=>row(x,`<span class="sub">${esc(x[I.finding])} · ${esc(x[I.location])}</span>`,`${cond(x[I.condition])}${state(x[I.inspection])}`)).join('')||`<div class="empty"><span class="ec">${icon('check',24)}</span><strong>Tidak ada tindak lanjut terbuka</strong>Seluruh temuan sudah ditutup.</div>`}</section>
<div class="stack"><section class="panel"><div class="hd"><div><h2>${icon('chart',17)}Distribusi kondisi alat</h2><p>Kondisi terkini dari ${total} aset</p></div></div><div class="body"><div class="stackbar">${conds.filter(c=>n(c)).map(c=>`<i style="width:${n(c)/total*100}%;background:${CONDCOLOR[c]}"></i>`).join('')}</div>${conds.map(c=>`<div class="dist">${cond(c)}<b>${n(c)} alat</b></div><div class="bar"><i style="width:${n(c)/total*100}%;background:${CONDCOLOR[c]}"></i></div>`).join('')}</div></section>
<section class="panel"><div class="hd"><div><h2>${icon('pin',17)}Lokasi perlu perhatian</h2><p>Jumlah alat yang tidak berkondisi baik</p></div></div><div class="body">${locs.map(k=>`<div class="dist"><span class="sub" style="color:var(--i);font-weight:600">${esc(k)}</span><b>${byLoc[k].bad}/${byLoc[k].t}</b></div><div class="bar"><i style="width:${byLoc[k].bad/byLoc[k].t*100}%;background:${byLoc[k].bad?'var(--o)':'var(--g)'}"></i></div>`).join('')}</div></section></div></div>`}
function paintIcons(){document.querySelectorAll('[data-icon]').forEach(el=>{if(el.dataset.painted)return;el.dataset.painted='1';el.insertAdjacentHTML('afterbegin',icon(el.dataset.icon,Number(el.dataset.isz||20)))})}
paintIcons();draw();
</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="supabase-client.js"></script></body></html>
